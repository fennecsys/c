<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <title>My Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        /* =====================================================================
           Design tokens (every value below is overridden by the chosen design)
           ===================================================================== */
        :root {
            --bg: #0a0f1e;
            --text: #eef2ff;
            --muted: #8f9bbd;
            --line: rgba(255, 255, 255, 0.09);
            --g1: #38bdf8;
            --g2: #818cf8;
            --g3: #c084fc;
            --gl1: #2563eb;
            --gl2: #9333ea;
            --gl3: #0891b2;

            --name-size: 30px;
            --align: center;

            --av-size: 108px;
            --av-radius: 50%;
            --av-pad: 3px;
            --av-ring: conic-gradient(from 210deg, var(--g1), var(--g2), var(--g3), var(--g1));
            --av-inner: #0d1328;
            --av-shadow: 0 20px 54px -18px rgba(129, 140, 248, .75);

            --card-radius: 20px;
            --card-gap: 12px;
            --card-pad: 12px;
            --card-bg: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .025));
            --card-border: rgba(255, 255, 255, 0.09);
            --card-blur: blur(14px);
            --tile: 54px;
            --tile-r: 16px;
            --tile-pad: 10px;
            --tile-font: 22px;
            --av-font: 34px;
            --cols: 2;
        }

        /* =====================================================================
           Base
           ===================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', 'Cairo', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        html[dir="rtl"] body {
            font-family: 'Cairo', 'Poppins', system-ui, sans-serif;
        }

        body.custom-font,
        html[dir="rtl"] body.custom-font {
            font-family: var(--font);
        }

        /* =====================================================================
           Background layers
           ===================================================================== */
        .layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .layer.glow i {
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .34;
            animation: drift 24s ease-in-out infinite alternate;
        }

        .layer.glow i:nth-child(1) { background: var(--gl1); top: -26vmax; left: -20vmax; }
        .layer.glow i:nth-child(2) { background: var(--gl2); bottom: -28vmax; right: -22vmax; animation-delay: -9s; }
        .layer.glow i:nth-child(3) { background: var(--gl3); top: 38%; left: 42%; width: 38vmax; height: 38vmax; opacity: .16; animation-delay: -15s; }

        @keyframes drift {
            to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); }
        }

        /* =====================================================================
           Page layout
           ===================================================================== */
        .page {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topbar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            min-height: 36px;
        }

        .lang {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background .25s, transform .2s;
        }

        .lang:hover  { background: rgba(255, 255, 255, 0.1); }
        .lang:active { transform: scale(.96); }

        /* =====================================================================
           Profile header
           ===================================================================== */
        .profile {
            text-align: var(--align);
            margin: 20px 0 30px;
            width: 100%;
            animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
        }

        .avatar {
            width: var(--av-size);
            height: var(--av-size);
            margin: 0 auto 20px;
            border-radius: var(--av-radius);
            padding: var(--av-pad);
            background: var(--av-ring);
            box-shadow: var(--av-shadow);
        }

        .profile.al-s .avatar { margin-inline-start: 0; margin-inline-end: auto; }
        .profile.al-e .avatar { margin-inline-start: auto; margin-inline-end: 0; }

        .avatar span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: var(--av-radius);
            background: var(--av-inner);
            font-size: var(--av-font);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .avatar svg { width: 40px; height: 40px; }

        .avatar img.photo {
            width: 100%;
            height: 100%;
            border-radius: var(--av-radius);
            object-fit: cover;
            background: #fff;
        }

        .name {
            font-size: var(--name-size);
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .name.solid {
            background: none;
            color: var(--g1);
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            white-space: pre-line;
        }

        .count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 6px 14px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: var(--muted);
        }

        .count b {
            color: var(--text);
            font-weight: 600;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, .6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            70%  { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .save {
            display: block;
            margin: 14px auto 0;
            padding: 10px 20px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .25s, transform .2s;
        }

        .profile.al-s .save { margin-inline-start: 0; margin-inline-end: auto; }
        .profile.al-e .save { margin-inline-start: auto; margin-inline-end: 0; }
        .profile.al-s .count, .profile.al-e .count { display: inline-flex; }

        .save:hover  { background: rgba(255, 255, 255, .12); }
        .save:active { transform: scale(.97); }

        .info {
            width: 100%;
            margin: -10px 0 22px;
            padding: 14px 16px;
            border-radius: var(--card-radius);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.7;
            white-space: pre-line;
            text-align: var(--align);
            overflow-wrap: anywhere;
        }

        .editlink { width: 100%; margin-top: 14px; text-align: center; font-size: 12px; opacity: .45; }
        .editlink a { color: var(--muted); text-decoration: none; }
        .editlink a:hover { opacity: 1; text-decoration: underline; }

        .foot {
            width: 100%;
            margin-top: 26px;
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.7;
            white-space: pre-line;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* =====================================================================
           Link cards
           ===================================================================== */
        .links {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            gap: var(--card-gap);
        }

        .links > * { grid-column: span var(--span, 1); }

        .heading {
            grid-column: 1 / -1;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .4px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .link {
            --b: #818cf8;
            --b-soft: rgba(129, 140, 248, .22);
            --b-mid: rgba(129, 140, 248, .55);
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: var(--card-pad) calc(var(--card-pad) + 2px);
            border-radius: var(--card-radius);
            text-decoration: none;
            color: var(--text);
            background: var(--own-bg, var(--card-bg));
            border: 1px solid var(--card-border);
            overflow: hidden;
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            font: inherit;
            text-align: start;
            width: 100%;
            transition: transform .3s cubic-bezier(.2, .8, .2, 1), border-color .3s, box-shadow .3s;
            animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
            animation-delay: calc(var(--i) * 70ms + 160ms);
        }

        .links.noshadow .link:hover,
        .links.noshadow .link:focus-visible { box-shadow: none; }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(130% 160% at 0% 0%, var(--b-soft), transparent 62%);
            opacity: 0;
            transition: opacity .35s;
        }

        .link:hover,
        .link:focus-visible {
            transform: translateY(-2px);
            border-color: var(--b-mid);
            box-shadow: 0 16px 36px -16px var(--b-mid);
            outline: none;
        }

        .link:hover::before,
        .link:focus-visible::before { opacity: 1; }

        .link:active { transform: scale(.985); }

        .link.featured {
            border-color: var(--b-mid);
            background: linear-gradient(135deg, var(--b-soft), rgba(255, 255, 255, .03));
            box-shadow: 0 18px 44px -20px var(--b-mid);
            padding-top: calc(var(--card-pad) + 6px);
            padding-bottom: calc(var(--card-pad) + 6px);
        }

        .link.featured .title { font-size: 17px; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }

        /* platform icon */
        .tile {
            position: relative;
            width: var(--tile);
            height: var(--tile);
            flex: none;
            border-radius: var(--tile-r);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .55);
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: var(--tile-pad);
        }

        .tile.t-soft  { background: var(--b-soft); box-shadow: none; }
        .tile.t-none  { background: transparent; box-shadow: none; }
        .tile.t-round { border-radius: 50%; }

        /* fallback when the platform logo file is missing */
        .tile.fb {
            background: linear-gradient(135deg, var(--b), var(--g3));
            color: #fff;
            font-size: var(--tile-font);
            font-weight: 700;
        }

        /* title + address */
        .meta {
            position: relative;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .url {
            margin-top: 2px;
            font-size: 12px;
            color: var(--muted);
            direction: ltr;
            text-align: start;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url.note {
            direction: inherit;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* arrow */
        .chev {
            position: relative;
            flex: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .07);
            color: var(--muted);
            transition: background .3s, color .3s, transform .3s;
        }

        .link:hover .chev,
        .link:focus-visible .chev {
            background: var(--b);
            color: #fff;
            transform: translateX(2px);
        }

        html[dir="rtl"] .link:hover .chev { transform: translateX(-2px); }

        .chev svg { width: 16px; height: 16px; }

        html[dir="rtl"] .chev svg { transform: scaleX(-1); }

        /* compact cards: half width / grid layout */
        .link.compact {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: calc(var(--card-pad) + 4px) var(--card-pad);
        }

        .link.compact .meta { flex: none; width: 100%; }
        .link.compact .url { text-align: center; }
        .link.compact .chev { display: none; }
        .link.compact .badge { position: absolute; top: 8px; inset-inline-end: 8px; }

        /* icon layout: only the logo and a small label */
        .link.icon {
            background: none;
            border-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 6px 2px;
            gap: 8px;
            overflow: visible;
        }

        .link.icon {
            flex-direction: column;
            justify-content: flex-start;
            text-align: center;
        }

        .link.icon .meta { flex: none; width: 100%; }
        .link.icon .chev { display: none; }
        .link.icon::before { display: none; }
        .link.icon:hover, .link.icon:focus-visible { box-shadow: none; border-color: transparent; }
        .link.icon .title { font-size: 12px; font-weight: 500; color: var(--muted); }
        .link.icon .url { display: none; }
        .link.icon .badge { top: 0; inset-inline-end: 2px; }

        /* =====================================================================
           Groups: one card that expands into several links
           ===================================================================== */
        .link.group {
            display: block;
            padding: 0;
        }

        .link.group.compact { padding: 0; }

        .head {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: var(--card-pad) calc(var(--card-pad) + 2px);
            background: none;
            border: 0;
            color: inherit;
            font: inherit;
            text-align: start;
            cursor: pointer;
            position: relative;
        }

        .link.group.compact .head {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: calc(var(--card-pad) + 4px) var(--card-pad);
        }

        .link.group.compact .head .meta { flex: none; width: 100%; }
        .link.group.compact .head .chev { display: none; }
        .link.group.compact .head .url { text-align: center; }

        .link.group.icon { padding: 0; }
        .link.group.icon .head { padding: 6px 2px; }

        .badge {
            flex: none;
            min-width: 24px;
            height: 24px;
            padding: 0 8px;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--b);
            position: relative;
        }

        .head .chev svg { transform: none; transition: transform .3s; }
        .link.group.open .head .chev svg { transform: rotate(180deg); }
        html[dir="rtl"] .head .chev svg { transform: none; }
        html[dir="rtl"] .link.group.open .head .chev svg { transform: rotate(180deg); }
        .link.group .head .chev { transform: none; }

        .rows {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 0 12px 12px;
            position: relative;
        }

        .link.group.open .rows { display: flex; animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: max(10px, calc(var(--card-radius) - 8px));
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 500;
            transition: background .25s, border-color .25s;
        }

        .row:hover, .row:focus-visible { background: var(--b-soft); border-color: var(--b-mid); outline: none; }
        .row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .row .txt small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; direction: ltr; text-align: start; }
        .row .chev { width: 26px; height: 26px; background: rgba(255, 255, 255, .07); }
        .row .chev svg { width: 13px; height: 13px; }
        .row:hover .chev { background: var(--b); color: #fff; }

        /* =====================================================================
           Background image + dim (separate layers: blur never touches the content)
           ===================================================================== */
        #layerImg { background-size: cover; background-position: center; transform: scale(1.08); display: none; }
        #layerDim { display: none; }

        /* =====================================================================
           Menu
           ===================================================================== */
        .menu { width: 100%; display: none; flex-direction: column; }
        .menu.on { display: flex; }

        .mcontact { display: flex; gap: 10px; width: 100%; margin-bottom: 8px; }
        .mcontact a {
            flex: 1; text-align: center; padding: 12px; border-radius: var(--card-radius);
            border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text);
            text-decoration: none; font-weight: 600; font-size: 14px;
            backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
        }

        .mnav {
            position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
            padding: 10px 2px; margin: 0 -2px; scrollbar-width: none;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .mnav::-webkit-scrollbar { display: none; }
        .mnav a {
            flex: none; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06); color: var(--text); text-decoration: none;
            font-size: 13px; font-weight: 600; white-space: nowrap;
        }

        .msec { scroll-margin-top: 64px; display: flex; flex-direction: column; gap: var(--card-gap); margin-top: 16px; }
        .msec h2 {
            font-size: 18px; font-weight: 700; color: var(--text);
            padding-inline-start: 10px; border-inline-start: 3px solid var(--g2);
        }

        .mi {
            display: flex; gap: 12px; padding: var(--card-pad); border-radius: var(--card-radius);
            border: 1px solid var(--card-border); background: var(--card-bg);
            backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
            animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
        }
        .mi img {
            width: 84px; height: 84px; flex: none; object-fit: cover;
            border-radius: max(8px, calc(var(--card-radius) - 6px)); background: rgba(255, 255, 255, .06);
        }
        .mi .mb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .mi .mt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .mi .mn { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
        .mi .mp { font-weight: 700; white-space: nowrap; color: var(--g1); }
        .mi .md { font-size: 13px; color: var(--muted); line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
        .mi.off { opacity: .55; }
        .mi.off .mn, .mi.off .mp { text-decoration: line-through; }
        .mi .sold {
            align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
            background: rgba(239, 68, 68, .18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, .35);
        }

        /* =====================================================================
           Error message
           ===================================================================== */
        .error-msg {
            display: none;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding: 28px 20px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            font-size: 15px;
        }

        .error-msg .ico {
            font-size: 34px;
            display: block;
            margin-bottom: 10px;
        }

        /* =====================================================================
           Reduced motion
           ===================================================================== */

        /* ---- decoration layers ---- */
        .deco { position: absolute; inset: -25%; background-repeat: repeat; }
        .deco.an-drift { animation: decoDrift 60s linear infinite; }
        .deco.an-float { animation: decoFloat 9s ease-in-out infinite; }
        .deco.an-spin { animation: decoSpin 140s linear infinite; }
        .deco.an-twinkle { animation: decoTwinkle 5s ease-in-out infinite; }
        @keyframes decoDrift { to { background-position: 240px 160px; } }
        @keyframes decoFloat { 50% { transform: translateY(-22px) rotate(var(--rot, 0deg)); } }
        @keyframes decoSpin { to { transform: rotate(calc(var(--rot, 0deg) + 360deg)); } }
        @keyframes decoTwinkle { 50% { opacity: calc(var(--o, .1) * .3); } }

        /* ---- menu v3 ---- */
        .mban { width: 100%; text-align: center; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--card-radius);
            background: linear-gradient(90deg, var(--g1), var(--g2)); color: #fff; font-weight: 700; font-size: 14.5px; }
        .minfo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; width: 100%; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
        .mstate { padding: 4px 11px; border-radius: 99px; font-weight: 700; font-size: 12px; border: 1px solid var(--line); }
        .mstate.open { color: #86efac; background: rgba(34, 197, 94, .14); border-color: rgba(34, 197, 94, .4); }

            }
        }

        // Facebook does not reliably take over normal https links on Android, so it gets its own
        // scheme: fb://facewebmodal opens any facebook.com page inside the app.
        // No package is forced, so Facebook Lite works too. Not installed -> normal web page.
        function toFacebookIntent(webUrl) {
            try {
                const u = new URL(webUrl);
                if (!/(^|\.)facebook\.com$/i.test(u.hostname)) return null;
                const target = "https://www.facebook.com" + u.pathname + u.search;
                return "intent://facewebmodal/f?href=" + encodeURIComponent(target) +
                    "#Intent;scheme=fb;S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
            } catch (e) {
                return null;
            }
        }

        function initials(name) {
            const words = name.trim().split(/\s+/).filter(Boolean);
            if (!words.length) return "";
            return (words.length === 1 ? words[0].slice(0, 2) : words[0][0] + words[1][0]).toUpperCase();
        }

        /* =====================================================================
           Decoding
           The QR link ends with  #<base64url(deflate(payload))>
             v1 payload (older codes):  name|id:link;id:link|logoId
             v2 payload (design pages): {"v":2,"n":...,"l":[...]}   (JSON)
           ===================================================================== */
        function inflateHash(hash) {
            let base64 = hash.replace(/-/g, "+").replace(/_/g, "/");
            while (base64.length % 4) base64 += "=";

            const raw = window.atob(base64);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            return pako.inflateRaw(bytes, { to: "string" });
        }

        // A text is a plain string, or {"ar": "...", "en": "..."} for a two-language page.
        function text(value) {
            if (typeof value === "string") return value.slice(0, MAX_TEXT);
            if (value && typeof value === "object" && !Array.isArray(value)) {
                const o = {
                    ar: typeof value.ar === "string" ? value.ar.slice(0, MAX_TEXT) : "",
                    en: typeof value.en === "string" ? value.en.slice(0, MAX_TEXT) : ""
                };
                return o.ar || o.en ? o : "";
            }
            return "";
        }

        function loc(v) {
            if (v && typeof v === "object") return v[state.lang] || v.ar || v.en || "";
            return v || "";
        }

        function safeImg(v) { return typeof v === "string" && IMG_RE.test(v) ? v : ""; }
        function safePhone(v) { return typeof v === "string" && /^\+?[0-9 ]{5,20}$/.test(v.trim()) ? v.trim() : ""; }

        // Old (v1) codes: the page must look exactly as before, so addresses stay visible.
        function parseLegacy(str) {
            const parts = str.split("|");
            const entries = [];
            (parts[1] || "").split(";").forEach(function (item) {
                const colon = item.indexOf(":");
                if (colon > -1) {
                    entries.push({ i: item.substring(0, colon), v: [item.substring(colon + 1)], sv: 1 });
                }
            });
            return { legacy: 1, type: "card", lgu: "", n: parts[0], h: "", b: "", f: "", vc: 0, l: entries, lg: parts[2] || "", d: "", dz: null };
        }

        function parseV2(obj) {
            const entries = [];
            (Array.isArray(obj.l) ? obj.l : []).slice(0, MAX_ENTRIES).forEach(function (e) {
                if (!e || typeof e.i !== "string") return;
                if (e.i === "_h") {
                    entries.push({ i: "_h", t: text(e.t) });
                    return;
                }
                const values = (Array.isArray(e.v) ? e.v : [e.v]).filter(function (v) {
                    return typeof v === "string" && v.trim() !== "";
                }).slice(0, MAX_VALUES).map(text);
                if (!values.length) return;
                entries.push({
                    i: e.i.slice(0, 4),
                    v: values,
                    t: text(e.t),
                    s: text(e.s),
                    lb: (Array.isArray(e.lb) ? e.lb : []).slice(0, MAX_VALUES).map(text),
                    sv: e.sv === 0 || e.sv === 1 ? e.sv : undefined,
                    gr: e.gr === 0 ? 0 : 1
                });
            });
            return {
                type: "card",
                n: text(obj.n), h: text(obj.h), b: text(obj.b), f: text(obj.f), vc: obj.vc ? 1 : 0, l: entries,
                lg: typeof obj.lg === "string" ? obj.lg : "", lgu: safeImg(obj.lgu),
                d: typeof obj.d === "string" ? obj.d : "",
                dl: obj.dl === "ar" || obj.dl === "en" ? obj.dl : "",
                dz: obj.dz && typeof obj.dz === "object" ? obj.dz : null
            };
        }

        const MAX_SIZES = 5;
        const MAX_SOC = 20;
        const BADGES = ["new", "hot", "top", "veg", "off"];

        function dateOk(v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : ""; }
        function timeOk(v) { return typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : ""; }
        function numOk(v, lo, hi) {
            const n = typeof v === "number" ? v : parseFloat(v);
            return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : 0;
        }
        function coordOk(v, lim) {
            const n = typeof v === "number" ? v : parseFloat(v);
            return isFinite(n) && Math.abs(n) <= lim ? n : null;
        }
        function priceNum(v) {
            const m = typeof v === "string" ? v.replace(",", ".").match(/\d+(?:\.\d+)?/) : null;
            return m ? parseFloat(m[0]) : null;
        }

        // Delivery settings. null = no ordering on this page.
        function parseOrder(o) {
            if (!isObj(o)) return null;
            const w = typeof o.w === "string" ? o.w.replace(/\D/g, "") : "";
            if (w.length < 6 || w.length > 16) return null;
            return {
                on: o.on ? 1 : 0, pz: o.pz ? 1 : 0, w: w,
                fee: numOk(o.fee, 0, 100000), min: numOk(o.min, 0, 10000000), free: numOk(o.free, 0, 10000000),
                max: numOk(o.max, 0, 500), lat: coordOk(o.lat, 90), lng: coordOk(o.lng, 180)
            };
        }

        function parseSoc(list) {
            const out = [];
            (Array.isArray(list) ? list : []).slice(0, MAX_SOC).forEach(function (e) {
                if (!isObj(e) || typeof e.i !== "string" || ADD_IDS.indexOf(e.i) < 0) return;
                const values = (Array.isArray(e.v) ? e.v : [e.v]).filter(function (v) { return typeof v === "string" && v.trim() !== ""; })
                    .slice(0, MAX_VALUES).map(function (v) { return v.slice(0, MAX_TEXT); });
                if (values.length) out.push({ i: e.i, v: values, t: text(e.t) });
            });
            return out;
        }

        function parseMenu(obj) {
            const sections = (Array.isArray(obj.s) ? obj.s : []).slice(0, MAX_SECTIONS).map(function (s) {
                if (!s || typeof s !== "object") return null;
                const items = (Array.isArray(s.i) ? s.i : []).slice(0, MAX_MENU_ITEMS).map(function (it) {
                    if (!it || typeof it !== "object") return null;
                    return {
                        t: text(it.t), d: text(it.d), p: typeof it.p === "string" ? it.p.slice(0, 40) : "",
                        po: typeof it.po === "string" ? it.po.slice(0, 40) : "",
                        sz: (Array.isArray(it.sz) ? it.sz : []).slice(0, MAX_SIZES).map(function (z) {
                            return isObj(z) && typeof z.p === "string" && z.p.trim() ? { l: text(z.l), p: z.p.slice(0, 40) } : null;
                        }).filter(Boolean),
                        bd: BADGES.indexOf(it.bd) >= 0 ? it.bd : "",
                        img: safeImg(it.img), off: it.off ? 1 : 0
                    };
                }).filter(Boolean);
                return { t: text(s.t), i: items };
            }).filter(Boolean);
            const ban = isObj(obj.ban) ? { t: text(obj.ban.t), f: dateOk(obj.ban.f), u: dateOk(obj.ban.u) } : null;
            const hrs = isObj(obj.hrs) && timeOk(obj.hrs.o) && timeOk(obj.hrs.c) ? { o: obj.hrs.o, c: obj.hrs.c } : null;
            return {
                type: "menu",
                n: text(obj.n), h: text(obj.h), b: text(obj.b), f: text(obj.f), cur: text(obj.cur),
                ph: safePhone(obj.ph), wa: safePhone(obj.wa), vc: 0, l: [], s: sections,
                ban: ban && ban.t ? ban : null, hrs: hrs, ad: text(obj.ad), soc: parseSoc(obj.soc), od: parseOrder(obj.od),
                lg: "", lgu: safeImg(obj.lgu), d: "",
                dl: obj.dl === "ar" || obj.dl === "en" ? obj.dl : "",
                dz: obj.dz && typeof obj.dz === "object" ? obj.dz : null
            };
        }

        /* =====================================================================
           Menu rendering: banner, open/closed, address, contacts, platforms, search,
           collapsible sections, sizes, offers, badges and the delivery cart.
           ===================================================================== */
        const cart = { lines: {}, name: "", note: "" };

        function todayStr() {
            const n = new Date();
            return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
        }

        function bannerVisible(b) {
            if (!b) return false;
            const t = todayStr();
            return (!b.f || b.f <= t) && (!b.u || t <= b.u);
        }

        function isOpenNow(h) {
            const n = new Date(), now = n.getHours() * 60 + n.getMinutes();
            const o = parseInt(h.o.slice(0, 2), 10) * 60 + parseInt(h.o.slice(3), 10);
            const c = parseInt(h.c.slice(0, 2), 10) * 60 + parseInt(h.c.slice(3), 10);
            if (o === c) return true;
            return o < c ? now >= o && now < c : now >= o || now < c;
        }

        function orderEnabled(d) { return !!(d.od && d.od.on && !d.od.pz); }
        function money(n, currency) {
            const v = Math.round(n * 100) / 100;
            return String(v % 1 ? v.toFixed(2) : v) + (currency ? " " + currency : "");
        }
        function cartCount() { return Object.keys(cart.lines).reduce(function (s, k) { return s + cart.lines[k].q; }, 0); }
        function cartSubtotal() { return Object.keys(cart.lines).reduce(function (s, k) { return s + cart.lines[k].q * cart.lines[k].u; }, 0); }
        function deliveryFee(od, subtotal) { return od.free > 0 && subtotal >= od.free ? 0 : od.fee; }

        function distanceKm(lat1, lng1, lat2, lng2) {
            const rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function addToCart(key, name, unit, label) {
            const line = cart.lines[key] || (cart.lines[key] = { n: name, l: label, u: unit, q: 0 });
            line.q = Math.min(line.q + 1, 99);
            refreshCart();
        }

        function orderMessage(d, lat, lng) {
            const t = I18N[state.lang], cur = loc(d.cur), od = d.od;
            const sub = cartSubtotal(), fee = deliveryFee(od, sub);
            const lines = [t.msgTitle, ""];
            Object.keys(cart.lines).forEach(function (k) {
                const ln = cart.lines[k];
                lines.push("• " + ln.n + (ln.l ? " (" + ln.l + ")" : "") + " ×" + ln.q + " = " + money(ln.q * ln.u, cur));
            });
            lines.push("", t.subtotal + ": " + money(sub, cur), t.delivery + ": " + (fee ? money(fee, cur) : t.free), t.total + ": " + money(sub + fee, cur));
            if (cart.name.trim()) lines.push("", t.yourName + ": " + cart.name.trim().slice(0, 60));
            if (cart.note.trim()) lines.push(t.note + ": " + cart.note.trim().slice(0, 200));
            lines.push("", "📍 https://www.google.com/maps?q=" + lat.toFixed(6) + "," + lng.toFixed(6));
            return lines.join("\n");
        }

        function sendOrder(d, status) {
            const t = I18N[state.lang], od = d.od, cur = loc(d.cur);
            const sub = cartSubtotal();
            if (!cartCount()) { status.textContent = t.cartEmpty; return; }
            if (od.min > 0 && sub < od.min) { status.textContent = t.minOrder + " " + money(od.min, cur); return; }
            if (!navigator.geolocation || !window.isSecureContext) { status.textContent = t.locUnsupported; return; }
            status.textContent = t.locWait;
            navigator.geolocation.getCurrentPosition(function (pos) {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                if (od.max > 0 && od.lat !== null && od.lng !== null) {
                    const km = distanceKm(od.lat, od.lng, lat, lng);
                    if (km > od.max) { status.textContent = t.outside + " (" + (Math.round(km * 10) / 10) + " km > " + od.max + " km)"; return; }
                }
                status.textContent = "";
                window.open("https://wa.me/" + od.w + "?text=" + encodeURIComponent(orderMessage(d, lat, lng)), "_blank", "noopener");
            }, function (err) {
                status.textContent = err && err.code === 1 ? t.locDenied : t.locFail;
            }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
        }

        function buildCartUi(d) {
            const t = I18N[state.lang], cur = loc(d.cur);
            let bar = $("cartBar"), sheet = $("cartSheet");
            if (bar) bar.remove();
            if (sheet) sheet.remove();
            if (!orderEnabled(d)) return;
            bar = el("button", "cartbar");
            bar.id = "cartBar";
            bar.type = "button";
            bar.style.display = "none";
            sheet = el("div", "cartsheet");
            sheet.id = "cartSheet";
            sheet.style.display = "none";
            document.body.appendChild(bar);
            document.body.appendChild(sheet);
            bar.addEventListener("click", function () { sheet.style.display = "flex"; refreshCart(); });
            sheet.addEventListener("click", function (ev) { if (ev.target === sheet) sheet.style.display = "none"; });
        }

        function refreshCart() {
            const d = state.data;
            if (!d || d.type !== "menu" || !orderEnabled(d)) return;
            const t = I18N[state.lang], cur = loc(d.cur), od = d.od;
            const bar = $("cartBar"), sheet = $("cartSheet");
            if (!bar || !sheet) return;
            const count = cartCount();
            bar.style.display = count ? "flex" : "none";
            bar.textContent = "";
            bar.appendChild(el("span", "", "🛒 " + count));
            bar.appendChild(el("span", "", t.viewOrder + " · " + money(cartSubtotal(), cur)));
            if (!count) sheet.style.display = "none";
            if (sheet.style.display === "none") return;

            sheet.textContent = "";
            const panel = el("div", "cartpanel");
            panel.appendChild(el("h3", "", t.yourOrder));
            Object.keys(cart.lines).forEach(function (k) {
                const ln = cart.lines[k], row = el("div", "cartrow");
                row.appendChild(el("div", "cn", ln.n + (ln.l ? " (" + ln.l + ")" : "")));
                const qty = el("div", "cq");
                const minus = el("button", "", "−"), plus = el("button", "", "+");
                minus.type = plus.type = "button";
                minus.addEventListener("click", function () { ln.q -= 1; if (ln.q <= 0) delete cart.lines[k]; refreshCart(); });
                plus.addEventListener("click", function () { ln.q = Math.min(ln.q + 1, 99); refreshCart(); });
                qty.appendChild(minus);
                qty.appendChild(el("span", "", String(ln.q)));
                qty.appendChild(plus);
                row.appendChild(qty);
                row.appendChild(el("div", "cp", money(ln.q * ln.u, cur)));
                panel.appendChild(row);
            });
            const sub = cartSubtotal(), fee = deliveryFee(od, sub);
            [[t.subtotal, money(sub, cur)], [t.delivery, fee ? money(fee, cur) : t.free], [t.total, money(sub + fee, cur)]].forEach(function (r, i) {
                const row = el("div", "carttot" + (i === 2 ? " grand" : ""));
                row.appendChild(el("span", "", r[0]));
                row.appendChild(el("span", "", r[1]));
                panel.appendChild(row);
            });
            if (od.free > 0 && sub < od.free) panel.appendChild(el("div", "cartnote", t.freeFrom + " " + money(od.free, cur)));
            const name = el("input"), note = el("input");
            name.type = note.type = "text";
            name.placeholder = t.yourName;
            note.placeholder = t.note;
            name.maxLength = 60;
            note.maxLength = 200;
            name.value = cart.name;
            note.value = cart.note;
            name.addEventListener("input", function () { cart.name = name.value; });
            note.addEventListener("input", function () { cart.note = note.value; });
            panel.appendChild(name);
            panel.appendChild(note);
            panel.appendChild(el("div", "cartnote", "📍 " + t.locNeeded));
            const status = el("div", "cartstatus");
            const go = el("button", "cartgo", t.sendWa);
            go.type = "button";
            go.addEventListener("click", function () { sendOrder(d, status); });
            const close = el("button", "cartclose", t.close);
            close.type = "button";
            close.addEventListener("click", function () { sheet.style.display = "none"; });
            panel.appendChild(status);
            panel.appendChild(go);
            panel.appendChild(close);
            sheet.appendChild(panel);
        }

        function menuLink(a, id, value) {
            wireLink(a, id, buildUrl(id, value));
        }

        function renderMenu() {
            const d = state.data, t = I18N[state.lang];
            const box = $("menu");
            box.innerHTML = "";
            box.classList.add("on");
            const currency = loc(d.cur);
            const canOrder = orderEnabled(d);

            if (bannerVisible(d.ban)) box.appendChild(el("div", "mban", loc(d.ban.t)));

            if (d.hrs || d.ad || (d.od && d.od.lat !== null)) {
                const info = el("div", "minfo");
                if (d.hrs) {
                    const open = isOpenNow(d.hrs);
                    info.appendChild(el("span", "mstate " + (open ? "open" : "closed"), (open ? t.openNow : t.closedNow) + " · " + d.hrs.o + "–" + d.hrs.c));
                }
                if (d.ad) info.appendChild(el("span", "maddr", d.ad && loc(d.ad)));
                const hasPoint = d.od && d.od.lat !== null && d.od.lng !== null;
                if (hasPoint || loc(d.ad)) {
                    const a = el("a", "mdir", t.directions);
                    a.href = hasPoint
                        ? "https://www.google.com/maps/dir/?api=1&destination=" + d.od.lat + "," + d.od.lng
                        : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(loc(d.ad));
                    a.target = "_blank";
                    a.rel = "noopener";
                    info.appendChild(a);
                }
                box.appendChild(info);
            }

            if (d.ph || d.wa) {
                const row = el("div", "mcontact");
                if (d.ph) {
                    const a = el("a", "", t.call);
                    a.href = "tel:" + d.ph.replace(/[^\d+]/g, "");
                    row.appendChild(a);
                }
                if (d.wa) {
                    const a = el("a", "", t.whatsapp);
                    a.href = "https://wa.me/" + d.wa.replace(/[^\d]/g, "");
                    a.target = "_blank";
                    a.rel = "noopener";
                    row.appendChild(a);
                }
                box.appendChild(row);
            }

            if (d.soc.length) {
                const row = el("div", "msoc");
                d.soc.forEach(function (e) {
                    e.v.forEach(function (v) {
                        const a = el("a", "msocitem");
                        const label = loc(e.t) || t.names[e.i] || e.i;
                        a.title = label;
                        a.setAttribute("aria-label", label);
                        a.appendChild(createTile(e.i, label, "white"));
                        menuLink(a, e.i, v);
                        row.appendChild(a);
                    });
                });
                box.appendChild(row);
            }

            const nonEmpty = d.s.filter(function (s) { return s.i.length; });
            const totalDishes = nonEmpty.reduce(function (s, x) { return s + x.i.length; }, 0);
            let search = null;
            if (totalDishes > 6) {
                search = el("input", "msearch");
                search.type = "search";
                search.placeholder = t.search;
                search.setAttribute("aria-label", t.search);
                box.appendChild(search);
            }

            if (nonEmpty.length > 1) {
                const nav = el("div", "mnav");
                nonEmpty.forEach(function (s, n) {
                    const a = el("a", "", loc(s.t) || String(n + 1));
                    a.href = "#sec" + n;
                    a.addEventListener("click", function (ev) {
                        ev.preventDefault();     // the page address must stay as it is (id or data)
                        const target = document.getElementById("sec" + n);
                        if (target) {
                            target.classList.remove("collapsed");
                            target.scrollIntoView({ behavior: "smooth", block: "start" });
                        }
                    });
                    nav.appendChild(a);
                });
                box.appendChild(nav);
            }

            const secNodes = [];
            let order = 0;
            nonEmpty.forEach(function (s, n) {
                const sec = el("section", "msec");
                sec.id = "sec" + n;
                if (loc(s.t)) {
                    const h = el("h2", "", loc(s.t));
                    h.tabIndex = 0;
                    h.addEventListener("click", function () { sec.classList.toggle("collapsed"); });
                    h.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sec.classList.toggle("collapsed"); } });
                    sec.appendChild(h);
                }
                const cards = [];
                s.i.forEach(function (it, ii) {
                    const card = el("div", "mi" + (it.off ? " off" : ""));
                    card.style.animationDelay = Math.min(order++, 12) * 40 + "ms";
                    card.dataset.q = (loc(it.t) + " " + loc(it.d)).toLowerCase();
                    if (it.img) {
                        const img = document.createElement("img");
                        img.alt = "";
                        img.loading = "lazy";
                        img.src = it.img;
                        img.onerror = function () { img.remove(); };
                        card.appendChild(img);
                    }
                    const body = el("div", "mb");
                    const top = el("div", "mt");
                    const nameBox = el("div", "mnb");
                    nameBox.appendChild(el("div", "mn", loc(it.t)));
                    if (it.bd) nameBox.appendChild(el("span", "bd bd-" + it.bd, t.badges[it.bd]));
                    top.appendChild(nameBox);
                    if (it.p && !it.sz.length) {
                        const price = el("div", "mp");
                        if (it.po) price.appendChild(el("s", "", it.po));
                        price.appendChild(document.createTextNode(it.p + (currency ? " " + currency : "")));
                        top.appendChild(price);
                    }
                    body.appendChild(top);
                    if (loc(it.d)) body.appendChild(el("div", "md", loc(it.d)));
                    if (it.sz.length) {
                        const sizes = el("div", "msz");
                        it.sz.forEach(function (z, k) {
                            const chip = el("span", "mszc");
                            chip.appendChild(el("b", "", loc(z.l) || ""));
                            chip.appendChild(document.createTextNode(" " + z.p + (currency ? " " + currency : "")));
                            const unit = priceNum(z.p);
                            if (canOrder && !it.off && unit !== null) {
                                const add = el("button", "madd", "+");
                                add.type = "button";
                                add.setAttribute("aria-label", t.add);
                                add.addEventListener("click", function () { addToCart(n + ":" + ii + ":" + k, loc(it.t), unit, loc(z.l)); });
                                chip.appendChild(add);
                            }
                            sizes.appendChild(chip);
                        });
                        body.appendChild(sizes);
                    } else if (canOrder && !it.off && priceNum(it.p) !== null) {
                        const add = el("button", "madd wide", "+ " + t.add);
                        add.type = "button";
                        add.addEventListener("click", function () { addToCart(n + ":" + ii, loc(it.t), priceNum(it.p), ""); });
                        body.appendChild(add);
                    }
                    if (it.off) body.appendChild(el("span", "sold", t.soldOut));
                    card.appendChild(body);
                    sec.appendChild(card);
                    cards.push(card);
                });
                secNodes.push({ sec: sec, cards: cards });
                box.appendChild(sec);
            });

            if (search) {
                search.addEventListener("input", function () {
                    const q = search.value.trim().toLowerCase();
                    secNodes.forEach(function (g) {
                        let any = false;
                        g.cards.forEach(function (c) {
                            const hit = !q || c.dataset.q.indexOf(q) >= 0;
                            c.style.display = hit ? "" : "none";
                            if (hit) any = true;
                        });
                        g.sec.style.display = any ? "" : "none";
                        if (q && any) g.sec.classList.remove("collapsed");
                    });
                });
            }

            buildCartUi(d);
            refreshCart();
        }

        /* =====================================================================
           Client edits (Firestore overlay)
           The page (items/<id>.json) is the base. A client may change a few things from admin.html;
           those changes live in Firestore (pages/<id>: perm + content) and are merged on top here,
           BEFORE the normal parsing, so every value still goes through the same cleaning as the base.
           Any problem (no config, offline, slow, no document) -> the base page is shown unchanged.
           ===================================================================== */
        const FB_TIMEOUT_MS = 2500;
        const OVERLAY_MAX_CHARS = 60000;
        const MAX_ADDED = 20;
        const ADD_IDS = ["f", "d", "i", "l", "lc", "p", "s", "t", "tl", "w", "wb", "x", "y", "e", "tp"];

        function fbConfig() {
            const c = window.FB_CONFIG;
            return c && typeof c.projectId === "string" && /^[a-z0-9-]{4,40}$/.test(c.projectId) ? c : null;
        }

        function isObj(v) { return !!v && typeof v === "object" && !Array.isArray(v); }

        // Firestore REST value -> plain JavaScript value
        function fsDecode(v) {
            if (!isObj(v)) return null;
            if ("stringValue" in v) return v.stringValue;
            if ("integerValue" in v) return Number(v.integerValue);
            if ("doubleValue" in v) return Number(v.doubleValue);
            if ("booleanValue" in v) return !!v.booleanValue;
            if ("mapValue" in v) {
                const out = {};
                const f = (v.mapValue && v.mapValue.fields) || {};
                Object.keys(f).forEach(function (k) { if (k !== "__proto__") out[k] = fsDecode(f[k]); });
                return out;
            }
            if ("arrayValue" in v) return ((v.arrayValue && v.arrayValue.values) || []).map(fsDecode);
            return null;
        }

        function fetchOverlay(id) {
            const cfg = fbConfig();
            if (!cfg || typeof fetch !== "function") return Promise.resolve(null);
            const url = "https://firestore.googleapis.com/v1/projects/" + cfg.projectId +
                "/databases/(default)/documents/pages/" + id;
            const request = fetch(url)
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (doc) {
                    if (!doc || !isObj(doc.fields)) return null;
                    return { owner: fsDecode(doc.fields.owner) || "", perm: fsDecode(doc.fields.perm) || {}, content: fsDecode(doc.fields.content) || {}, stats: fsDecode(doc.fields.stats) === 1 ? 1 : 0 };
                })
                .catch(function () { return null; });
            const timeout = new Promise(function (resolve) { setTimeout(function () { resolve(null); }, FB_TIMEOUT_MS); });
            return Promise.race([request, timeout]);
        }

        // A small link to admin.html, only for pages that have a client login (set showEditLink:false in firebase-config.js to hide it)
        function showEditLink(ov) {
            try {
                const cfg = fbConfig();
                if (!cfg || cfg.showEditLink === false || !ov || typeof ov.owner !== "string" || !ov.owner) return;
                $("editLink").style.display = "block";
            } catch (e) { /* the link is optional */ }
        }

        function applyOverlay(base, ov) {
            try {
                if (!ov || !isObj(ov.content) || !isObj(ov.perm)) return base;
                if (JSON.stringify(ov.content).length > OVERLAY_MAX_CHARS) return base;
                const c = ov.content, p = ov.perm;
                const obj = JSON.parse(JSON.stringify(base));
                const isMenu = obj.type === "menu";

                function putText(target, key, value) {
                    const v = text(value);
                    if (v === "") delete target[key]; else target[key] = v;
                }
                function put(key) { if (key in c) putText(obj, key, c[key]); }

                if (p.n) put("n");
                if (p.tx) { put("h"); put("f"); if (!isMenu) put("b"); }
                if (isMenu && p.mc) {
                    put("cur");
                    ["ph", "wa"].forEach(function (key) {
                        if (!(key in c)) return;
                        const v = typeof c[key] === "string" ? c[key].trim().slice(0, 25) : "";
                        if (v === "") delete obj[key]; else obj[key] = v;
                    });
                }

                if (!isMenu && (p.lk || p.la) && isObj(c.l) && Array.isArray(obj.l)) {
                    Object.keys(c.l).forEach(function (k) {
                        if (!/^\d{1,2}$/.test(k)) return;
                        const e = obj.l[Number(k)], o = c.l[k];
                        if (!isObj(e) || e.i === "_h" || !isObj(o)) return;
                        if (o.hide && p.la) { e.v = []; return; }          // delete (hide) needs "la"
                        if (!p.lk) return;                                   // editing needs "lk"
                        if (Array.isArray(o.v)) {
                            e.v = o.v.filter(function (s) { return typeof s === "string"; })
                                .slice(0, MAX_VALUES).map(function (s) { return s.slice(0, MAX_TEXT); });
                        }
                        if (Array.isArray(o.lb)) e.lb = o.lb.slice(0, MAX_VALUES).map(text);
                        if ("t" in o) putText(e, "t", o.t);
                        if ("s" in o) putText(e, "s", o.s);
                    });
                }

                // new platforms added by the client (appended after the existing ones; needs "la")
                if (!isMenu && p.la && Array.isArray(c.add) && Array.isArray(obj.l)) {
                    c.add.slice(0, MAX_ADDED).forEach(function (a) {
                        if (!isObj(a) || ADD_IDS.indexOf(a.i) < 0 || obj.l.length >= MAX_ENTRIES) return;
                        const v = (Array.isArray(a.v) ? a.v : [])
                            .filter(function (s) { return typeof s === "string" && s.trim() !== ""; })
                            .slice(0, MAX_VALUES).map(function (s) { return s.slice(0, MAX_TEXT); });
                        if (!v.length) return;
                        const entry = { i: a.i, v: v };
                        if (Array.isArray(a.lb)) entry.lb = a.lb.slice(0, MAX_VALUES).map(text);
                        const t = text(a.t);
                        if (t !== "") entry.t = t;
                        obj.l.push(entry);
                    });
                }

                if (isMenu && isObj(c.s) && Array.isArray(obj.s)) {
                    Object.keys(c.s).forEach(function (sk) {
                        if (!/^\d{1,2}$/.test(sk)) return;
                        const sec = obj.s[Number(sk)], so = c.s[sk];
                        if (!isObj(sec) || !isObj(so)) return;
                        if (p.mn && "t" in so) putText(sec, "t", so.t);
                        if (!isObj(so.i) || !Array.isArray(sec.i)) return;
                        Object.keys(so.i).forEach(function (ik) {
                            if (!/^\d{1,3}$/.test(ik)) return;
                            const it = sec.i[Number(ik)], io = so.i[ik];
                            if (!isObj(it) || !isObj(io)) return;
                            if (p.mp) {
                                if ("p" in io) {
                                    const pv = typeof io.p === "string" ? io.p.trim().slice(0, 40) : "";
                                    if (pv === "") delete it.p; else it.p = pv;
                                }
                                if ("off" in io) { if (io.off) it.off = 1; else delete it.off; }
                            }
                            if (p.mn) {
                                if ("t" in io && text(io.t) !== "") it.t = text(io.t);   // a dish always keeps a name
                                if ("d" in io) putText(it, "d", io.d);
                            }
                        });
                    });
                }
                if (isMenu) {
                    // what the owner lets the client change on a menu: price extras, badges, banner, hours, delivery, platforms
                    if (isObj(c.s) && Array.isArray(obj.s)) {
                        Object.keys(c.s).forEach(function (sk) {
                            if (!/^\d{1,2}$/.test(sk)) return;
                            const sec = obj.s[Number(sk)], so = c.s[sk];
                            if (!isObj(sec) || !isObj(so) || !isObj(so.i) || !Array.isArray(sec.i)) return;
                            Object.keys(so.i).forEach(function (ik) {
                                if (!/^\d{1,3}$/.test(ik)) return;
                                const it = sec.i[Number(ik)], io = so.i[ik];
                                if (!isObj(it) || !isObj(io)) return;
                                if (p.mp) {
                                    if ("po" in io) {
                                        const pv = typeof io.po === "string" ? io.po.trim().slice(0, 40) : "";
                                        if (pv === "") delete it.po; else it.po = pv;
                                    }
                                    if (isObj(io.sz) && Array.isArray(it.sz)) {
                                        Object.keys(io.sz).forEach(function (zk) {
                                            if (!/^\d$/.test(zk) || !isObj(it.sz[Number(zk)])) return;
                                            const pv = typeof io.sz[zk] === "string" ? io.sz[zk].trim().slice(0, 40) : "";
                                            if (pv !== "") it.sz[Number(zk)].p = pv;
                                        });
                                    }
                                }
                                if (p.mo && "bd" in io) {
                                    if (BADGES.indexOf(io.bd) >= 0) it.bd = io.bd; else delete it.bd;
                                }
                            });
                        });
                    }
                    if (p.mo) {
                        if (isObj(c.ban)) {
                            const b = { t: text(c.ban.t), f: dateOk(c.ban.f), u: dateOk(c.ban.u) };
                            if (b.t === "") delete obj.ban; else obj.ban = b;
                        }
                        if (isObj(c.hrs)) {
                            if (timeOk(c.hrs.o) && timeOk(c.hrs.c)) obj.hrs = { o: c.hrs.o, c: c.hrs.c };
                            else if (c.hrs.o === "" && c.hrs.c === "") delete obj.hrs;
                        }
                        if ("ad" in c) putText(obj, "ad", c.ad);
                    }
                    if (p.md && isObj(c.od) && isObj(obj.od)) {
                        ["fee", "min", "free", "max"].forEach(function (k) {
                            if (k in c.od) obj.od[k] = numOk(c.od[k], 0, k === "max" ? 500 : 10000000);
                        });
                        if ("pz" in c.od) obj.od.pz = c.od.pz ? 1 : 0;
                    }
                    if ((p.lk || p.la) && Array.isArray(obj.soc)) {
                        if (isObj(c.sl)) {
                            Object.keys(c.sl).forEach(function (k) {
                                if (!/^\d{1,2}$/.test(k)) return;
                                const e = obj.soc[Number(k)], o = c.sl[k];
                                if (!isObj(e) || !isObj(o)) return;
                                if (o.hide && p.la) { e.v = []; return; }
                                if (!p.lk) return;
                                if (Array.isArray(o.v)) e.v = o.v.filter(function (s) { return typeof s === "string"; }).slice(0, MAX_VALUES).map(function (s) { return s.slice(0, MAX_TEXT); });
                                if ("t" in o) putText(e, "t", o.t);
                            });
                        }
                        if (p.la && Array.isArray(c.sadd)) {
                            c.sadd.slice(0, MAX_ADDED).forEach(function (a) {
                                if (!isObj(a) || ADD_IDS.indexOf(a.i) < 0 || obj.soc.length >= MAX_SOC) return;
                                const v = (Array.isArray(a.v) ? a.v : []).filter(function (s) { return typeof s === "string" && s.trim() !== ""; }).slice(0, MAX_VALUES).map(function (s) { return s.slice(0, MAX_TEXT); });
                                if (!v.length) return;
                                const entry = { i: a.i, v: v }, t = text(a.t);
                                if (t !== "") entry.t = t;
                                obj.soc.push(entry);
                            });
                        }
                    }
                }
                return obj;
            } catch (e) {
                return base;
            }
        }

        /* =====================================================================
           Decoration layers (design.dc): up to 12 vector layers behind the content.
           Every value is validated; the pictures are generated here from numbers only (no text from the file
           ever reaches the markup), they sit behind everything and never exceed 45% strength.
           ===================================================================== */
        const DECO_KINDS = ["stripes", "hlines", "vlines", "grid", "checker", "rays", "grain", "dots", "dots2", "diamonds",
            "hex", "triangles", "rings", "plus", "cross", "stars", "waves", "zigzag", "scales", "fan", "topo", "confetti",
            "bubbles", "leaves", "arabesque", "zellige", "ornament", "meander", "bricks", "herringbone"];
        const DECO_ANIM = ["none", "drift", "float", "spin", "twinkle"];
        const DECO_BLEND = ["normal", "screen", "overlay", "soft-light", "multiply", "lighten", "darken"];
        const MAX_DECO = 12;

        function cleanDeco(raw) {
            if (!Array.isArray(raw)) return [];
            return raw.slice(0, MAX_DECO).map(function (l) {
                if (!l || typeof l !== "object" || DECO_KINDS.indexOf(l.k) < 0) return null;
                return {
                    k: l.k,
                    c: cleanValue(["c"], l.c, "#ffffff"),
                    c2: cleanValue(["c0"], l.c2, ""),
                    o: cleanValue(["n", 0.02, 0.45], l.o, 0.12),
                    s: cleanValue(["n", 8, 400], l.s, 64),
                    d: cleanValue(["n", 1, 100], l.d, 50),
                    a: cleanValue(["n", 0, 360], l.a, 0),
                    sd: Math.round(cleanValue(["n", 0, 99999], l.sd, 1)),
                    an: DECO_ANIM.indexOf(l.an) > 0 ? l.an : "none",
                    bm: DECO_BLEND.indexOf(l.bm) >= 0 ? l.bm : "normal"
                };
            }).filter(Boolean);
        }

        function decoRng(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function r2(n) { return Math.round(n * 100) / 100; }

        function starPoints(cx, cy, big, small, n, rot) {
            const pts = [];
            for (let i = 0; i < n * 2; i++) {
                const r = i % 2 ? small : big, ang = rot + (Math.PI * i) / n;
                pts.push(r2(cx + r * Math.cos(ang)) + "," + r2(cy + r * Math.sin(ang)));
            }
            return pts.join(" ");
        }

        // CSS based kinds -> { image, size }, vector tile kinds -> { image: url(svg), size }
        function decoImage(L) {
            const S = L.s, D = L.d / 100, c = L.c, c2 = L.c2, R = decoRng(L.sd + 1);
            const lw = Math.max(1, r2(S * 0.012 * (0.6 + D * 2.4)));
            const other = c2 || "transparent";
            switch (L.k) {
                case "stripes": {
                    const w = Math.max(2, r2(S * D * 0.5));
                    return { image: "repeating-linear-gradient(0deg, " + c + " 0 " + w + "px, " + other + " " + w + "px " + w * 2 + "px)", size: "auto" };
                }
                case "hlines":
                    return { image: "repeating-linear-gradient(180deg, " + c + " 0 " + lw + "px, transparent " + lw + "px " + S + "px)", size: "auto" };
                case "vlines":
                    return { image: "repeating-linear-gradient(90deg, " + c + " 0 " + lw + "px, transparent " + lw + "px " + S + "px)", size: "auto" };
                case "grid":
                    return { image: "linear-gradient(" + c + " " + lw + "px, transparent " + lw + "px), linear-gradient(90deg, " + c + " " + lw + "px, transparent " + lw + "px)", size: S + "px " + S + "px" };
                case "checker":
                    return { image: "conic-gradient(" + c + " 25%, " + other + " 0 50%, " + c + " 0 75%, " + other + " 0)", size: S + "px " + S + "px" };
                case "rays": {
                    const n = Math.max(2, r2(2 + D * 12));
                    return { image: "repeating-conic-gradient(from 0deg at 50% 30%, " + c + " 0 " + n + "deg, " + other + " " + n + "deg " + n * 2 + "deg)", size: "100% 100%", norepeat: true };
                }
            }
            let w = S, h = S, body = "";
            const stroke = 'fill="none" stroke="' + c + '" stroke-width="' + lw + '" stroke-linecap="round" stroke-linejoin="round"';
            const stroke2 = 'fill="none" stroke="' + (c2 || c) + '" stroke-width="' + lw + '" stroke-linecap="round" stroke-linejoin="round"';
            const fill = 'fill="' + c + '"', fill2 = 'fill="' + (c2 || c) + '"';
            const half = S / 2;
            switch (L.k) {
                case "grain":
                    w = h = 200;
                    return {
                        image: 'url("data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='" + r2(0.5 + D * 0.5) + "' numOctaves='2' seed='" + (L.sd % 1000) + "' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 " + parseInt(c.slice(1, 3), 16) / 255 + " 0 0 0 0 " + parseInt(c.slice(3, 5), 16) / 255 + " 0 0 0 0 " + parseInt(c.slice(5, 7), 16) / 255 + " 0 0 0 1.4 -0.35'/></filter><rect width='200' height='200' filter='url(#n)'/></svg>") + '")',
                        size: "200px 200px"
                    };
                case "dots":
                    body = '<circle cx="' + half + '" cy="' + half + '" r="' + r2(S * (0.03 + D * 0.09)) + '" ' + fill + "/>";
                    break;
                case "dots2": {
                    const r = r2(S * (0.03 + D * 0.08));
                    body = '<circle cx="' + S / 4 + '" cy="' + S / 4 + '" r="' + r + '" ' + fill + '/><circle cx="' + S * 0.75 + '" cy="' + S * 0.75 + '" r="' + r + '" ' + fill2 + "/>";
                    break;
                }
                case "diamonds":
                    body = '<path d="M' + half + " " + S * 0.08 + "L" + S * 0.92 + " " + half + "L" + half + " " + S * 0.92 + "L" + S * 0.08 + " " + half + 'Z" ' + stroke + "/>" +
                        (D > 0.45 ? '<path d="M' + half + " " + S * 0.3 + "L" + S * 0.7 + " " + half + "L" + half + " " + S * 0.7 + "L" + S * 0.3 + " " + half + 'Z" ' + stroke2 + "/>" : "");
                    break;
                case "hex": {
                    const a = S / 3, hh = r2(a * 1.732);
                    h = hh;
                    const hex = function (cx, cy) {
                        return '<polygon points="' + [[a, 0], [a / 2, hh / 2], [-a / 2, hh / 2], [-a, 0], [-a / 2, -hh / 2], [a / 2, -hh / 2]].map(function (p) { return r2(cx + p[0]) + "," + r2(cy + p[1]); }).join(" ") + '" ' + stroke + "/>";
                    };
                    body = [[0, 0], [S, 0], [0, hh], [S, hh], [S / 2, hh / 2], [S / 2, -hh / 2], [S / 2, hh * 1.5]].map(function (p) { return hex(p[0], p[1]); }).join("");
                    break;
                }
                case "triangles": {
                    const hh = r2(S * 0.866);
                    h = hh;
                    body = '<path d="M0 0H' + S + "M0 " + hh + "H" + S + "M0 " + hh + "L" + half + " 0L" + S + " " + hh + "M0 0L" + half + " " + hh + "L" + S + ' 0" ' + stroke + "/>";
                    break;
                }
                case "rings": {
                    const n = 2 + Math.round(D * 4);
                    for (let i = 1; i <= n; i++) body += '<circle cx="' + half + '" cy="' + half + '" r="' + r2((S * 0.46 * i) / n) + '" ' + (i % 2 ? stroke : stroke2) + "/>";
                    break;
                }
                case "plus": {
                    const arm = r2(S * (0.06 + D * 0.14));
                    body = '<path d="M' + (half - arm) + " " + half + "H" + (half + arm) + "M" + half + " " + (half - arm) + "V" + (half + arm) + '" ' + stroke + "/>";
                    break;
                }
                case "cross": {
                    const arm = r2(S * (0.05 + D * 0.12));
                    body = '<path d="M' + (half - arm) + " " + (half - arm) + "L" + (half + arm) + " " + (half + arm) + "M" + (half + arm) + " " + (half - arm) + "L" + (half - arm) + " " + (half + arm) + '" ' + stroke + "/>";
                    break;
                }
                case "stars": {
                    const big = r2(S * (0.12 + D * 0.25));
                    body = '<polygon points="' + starPoints(half, half, big, big * 0.45, 5, -Math.PI / 2) + '" ' + fill + "/>" +
                        '<polygon points="' + starPoints(0, 0, big * 0.5, big * 0.22, 5, -Math.PI / 2) + '" ' + fill2 + "/>" +
                        '<polygon points="' + starPoints(S, S, big * 0.5, big * 0.22, 5, -Math.PI / 2) + '" ' + fill2 + "/>";
                    break;
                }
                case "waves": {
                    h = r2(S * 0.5);
                    const A = r2(S * (0.05 + D * 0.15));
                    body = '<path d="M0 ' + h / 2 + "Q" + S / 4 + " " + (h / 2 - A) + " " + half + " " + h / 2 + "T" + S + " " + h / 2 + '" ' + stroke + "/>";
                    break;
                }
                case "zigzag":
                    h = r2(S * 0.5);
                    body = '<path d="M0 ' + h * 0.75 + "L" + S / 4 + " " + h * 0.25 + "L" + half + " " + h * 0.75 + "L" + S * 0.75 + " " + h * 0.25 + "L" + S + " " + h * 0.75 + '" ' + stroke + "/>";
                    break;
                case "scales":
                case "fan": {
                    h = r2(S / 2);
                    const rings = L.k === "fan" ? 3 : 1;
                    for (let i = 1; i <= rings; i++) {
                        const rr = r2((S / 2) * (i / rings));
                        [[0, 0], [S, 0], [half, h]].forEach(function (p) { body += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + rr + '" ' + (i % 2 ? stroke : stroke2) + "/>"; });
                    }
                    break;
                }
                case "topo": {
                    const centers = 2 + Math.round(D * 2);
                    for (let k = 0; k < centers; k++) {
                        const cx = R() * S, cy = R() * S, base = S * (0.06 + R() * 0.05), p1 = R() * 6, p2 = R() * 6;
                        for (let i = 1; i <= 3 + Math.round(D * 4); i++) {
                            let d = "";
                            for (let s = 0; s <= 48; s++) {
                                const ang = (s / 48) * Math.PI * 2, rad = base * i * (1 + 0.16 * Math.sin(3 * ang + p1) + 0.09 * Math.sin(5 * ang + p2));
                                d += (s ? "L" : "M") + r2(cx + rad * Math.cos(ang)) + " " + r2(cy + rad * Math.sin(ang));
                            }
                            body += '<path d="' + d + 'Z" ' + stroke + "/>";
                        }
                    }
                    break;
                }
                case "confetti": {
                    const n = Math.min(90, Math.round((6 + D * 26) * (S / 120)));
                    for (let i = 0; i < n; i++) {
                        const x = r2(R() * S), y = r2(R() * S), sz = r2(S * (0.012 + R() * 0.03)), col = R() < 0.5 ? fill : fill2, kind = Math.floor(R() * 3), rot = Math.round(R() * 180);
                        if (kind === 0) body += '<rect x="' + x + '" y="' + y + '" width="' + sz * 2 + '" height="' + sz + '" ' + col + ' transform="rotate(' + rot + " " + x + " " + y + ')"/>';
                        else if (kind === 1) body += '<circle cx="' + x + '" cy="' + y + '" r="' + sz + '" ' + col + "/>";
                        else body += '<polygon points="' + x + "," + y + " " + r2(x + sz * 2) + "," + y + " " + r2(x + sz) + "," + r2(y - sz * 2) + '" ' + col + ' transform="rotate(' + rot + " " + x + " " + y + ')"/>';
                    }
                    break;
                }
                case "bubbles": {
                    const n = Math.min(60, Math.round((4 + D * 16) * (S / 140)));
                    for (let i = 0; i < n; i++) {
                        const x = r2(R() * S), y = r2(R() * S), rr = r2(S * (0.015 + R() * 0.06));
                        body += R() < 0.7 ? '<circle cx="' + x + '" cy="' + y + '" r="' + rr + '" ' + stroke + "/>" : '<circle cx="' + x + '" cy="' + y + '" r="' + r2(rr * 0.4) + '" ' + fill2 + "/>";
                    }
                    break;
                }
                case "leaves": {
                    const n = Math.min(40, Math.round((3 + D * 9) * (S / 180)));
                    for (let i = 0; i < n; i++) {
                        const x = r2(R() * S), y = r2(R() * S), rot = Math.round(R() * 360), sc = r2(S * (0.0012 + R() * 0.002) * (0.7 + D));
                        body += '<g transform="translate(' + x + " " + y + ") rotate(" + rot + ") scale(" + sc + ')"><path d="M0 0Q10 -14 0 -34Q-10 -14 0 0Z" ' + (R() < 0.5 ? fill : fill2) + ' stroke="none"/><path d="M0 0L0 -26" fill="none" stroke="' + c + '" stroke-width="' + r2(lw / sc * 0.5) + '"/></g>';
                    }
                    break;
                }
                case "arabesque": {
                    const big = S * 0.4, small = big * 0.7654;
                    [[half, half], [0, 0], [S, 0], [0, S], [S, S]].forEach(function (p, i) {
                        body += '<polygon points="' + starPoints(p[0], p[1], big, small, 8, -Math.PI / 8) + '" ' + (i ? stroke2 : stroke) + "/>";
                    });
