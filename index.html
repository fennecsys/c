<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <title>My Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        /* =====================================================================
           Design tokens (every value below is overridden by the chosen design)
           ===================================================================== */
        :root {
            --bg: #0a0f1e;
            --text: #eef2ff;
            --muted: #8f9bbd;
            --line: rgba(255, 255, 255, 0.09);
            --g1: #38bdf8;
            --g2: #818cf8;
            --g3: #c084fc;
            --gl1: #2563eb;
            --gl2: #9333ea;
            --gl3: #0891b2;

            --name-size: 30px;
            --align: center;

            --av-size: 108px;
            --av-radius: 50%;
            --av-pad: 3px;
            --av-ring: conic-gradient(from 210deg, var(--g1), var(--g2), var(--g3), var(--g1));
            --av-inner: #0d1328;
            --av-shadow: 0 20px 54px -18px rgba(129, 140, 248, .75);

            --card-radius: 20px;
            --card-gap: 12px;
            --card-pad: 12px;
            --card-bg: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .025));
            --card-border: rgba(255, 255, 255, 0.09);
            --card-blur: blur(14px);
            --tile: 54px;
            --tile-r: 16px;
            --tile-pad: 10px;
            --tile-font: 22px;
            --av-font: 34px;
            --cols: 2;
        }

        /* =====================================================================
           Base
           ===================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', 'Cairo', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        html[dir="rtl"] body {
            font-family: 'Cairo', 'Poppins', system-ui, sans-serif;
        }

        body.custom-font,
        html[dir="rtl"] body.custom-font {
            font-family: var(--font);
        }

        /* =====================================================================
           Background layers
           ===================================================================== */
        .layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .layer.glow i {
            position: absolute;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .34;
            animation: drift 24s ease-in-out infinite alternate;
        }

        .layer.glow i:nth-child(1) { background: var(--gl1); top: -26vmax; left: -20vmax; }
        .layer.glow i:nth-child(2) { background: var(--gl2); bottom: -28vmax; right: -22vmax; animation-delay: -9s; }
        .layer.glow i:nth-child(3) { background: var(--gl3); top: 38%; left: 42%; width: 38vmax; height: 38vmax; opacity: .16; animation-delay: -15s; }

        @keyframes drift {
            to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); }
        }

        /* =====================================================================
           Page layout
           ===================================================================== */
        .page {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .topbar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            min-height: 36px;
        }

        .lang {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background .25s, transform .2s;
        }

        .lang:hover  { background: rgba(255, 255, 255, 0.1); }
        .lang:active { transform: scale(.96); }

        /* =====================================================================
           Profile header
           ===================================================================== */
        .profile {
            text-align: var(--align);
            margin: 20px 0 30px;
            width: 100%;
            animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
        }

        .avatar {
            width: var(--av-size);
            height: var(--av-size);
            margin: 0 auto 20px;
            border-radius: var(--av-radius);
            padding: var(--av-pad);
            background: var(--av-ring);
            box-shadow: var(--av-shadow);
        }

        .profile.al-s .avatar { margin-inline-start: 0; margin-inline-end: auto; }
        .profile.al-e .avatar { margin-inline-start: auto; margin-inline-end: 0; }

        .avatar span {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: var(--av-radius);
            background: var(--av-inner);
            font-size: var(--av-font);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .avatar svg { width: 40px; height: 40px; }

        .avatar img.photo {
            width: 100%;
            height: 100%;
            border-radius: var(--av-radius);
            object-fit: cover;
            background: #fff;
        }

        .name {
            font-size: var(--name-size);
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .name.solid {
            background: none;
            color: var(--g1);
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            white-space: pre-line;
        }

        .count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 6px 14px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: var(--muted);
        }

        .count b {
            color: var(--text);
            font-weight: 600;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, .6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            70%  { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .save {
            display: block;
            margin: 14px auto 0;
            padding: 10px 20px;
            border-radius: 99px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06);
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .25s, transform .2s;
        }

        .profile.al-s .save { margin-inline-start: 0; margin-inline-end: auto; }
        .profile.al-e .save { margin-inline-start: auto; margin-inline-end: 0; }
        .profile.al-s .count, .profile.al-e .count { display: inline-flex; }

        .save:hover  { background: rgba(255, 255, 255, .12); }
        .save:active { transform: scale(.97); }

        .info {
            width: 100%;
            margin: -10px 0 22px;
            padding: 14px 16px;
            border-radius: var(--card-radius);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.7;
            white-space: pre-line;
            text-align: var(--align);
            overflow-wrap: anywhere;
        }

        .foot {
            width: 100%;
            margin-top: 26px;
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.7;
            white-space: pre-line;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* =====================================================================
           Link cards
           ===================================================================== */
        .links {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            gap: var(--card-gap);
        }

        .links > * { grid-column: span var(--span, 1); }

        .heading {
            grid-column: 1 / -1;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .4px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .link {
            --b: #818cf8;
            --b-soft: rgba(129, 140, 248, .22);
            --b-mid: rgba(129, 140, 248, .55);
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: var(--card-pad) calc(var(--card-pad) + 2px);
            border-radius: var(--card-radius);
            text-decoration: none;
            color: var(--text);
            background: var(--own-bg, var(--card-bg));
            border: 1px solid var(--card-border);
            overflow: hidden;
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            font: inherit;
            text-align: start;
            width: 100%;
            transition: transform .3s cubic-bezier(.2, .8, .2, 1), border-color .3s, box-shadow .3s;
            animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
            animation-delay: calc(var(--i) * 70ms + 160ms);
        }

        .links.noshadow .link:hover,
        .links.noshadow .link:focus-visible { box-shadow: none; }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(130% 160% at 0% 0%, var(--b-soft), transparent 62%);
            opacity: 0;
            transition: opacity .35s;
        }

        .link:hover,
        .link:focus-visible {
            transform: translateY(-2px);
            border-color: var(--b-mid);
            box-shadow: 0 16px 36px -16px var(--b-mid);
            outline: none;
        }

        .link:hover::before,
        .link:focus-visible::before { opacity: 1; }

        .link:active { transform: scale(.985); }

        .link.featured {
            border-color: var(--b-mid);
            background: linear-gradient(135deg, var(--b-soft), rgba(255, 255, 255, .03));
            box-shadow: 0 18px 44px -20px var(--b-mid);
            padding-top: calc(var(--card-pad) + 6px);
            padding-bottom: calc(var(--card-pad) + 6px);
        }

        .link.featured .title { font-size: 17px; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }

        /* platform icon */
        .tile {
            position: relative;
            width: var(--tile);
            height: var(--tile);
            flex: none;
            border-radius: var(--tile-r);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .55);
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: var(--tile-pad);
        }

        .tile.t-soft  { background: var(--b-soft); box-shadow: none; }
        .tile.t-none  { background: transparent; box-shadow: none; }
        .tile.t-round { border-radius: 50%; }

        /* fallback when the platform logo file is missing */
        .tile.fb {
            background: linear-gradient(135deg, var(--b), var(--g3));
            color: #fff;
            font-size: var(--tile-font);
            font-weight: 700;
        }

        /* title + address */
        .meta {
            position: relative;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: 15.5px;
            font-weight: 600;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .url {
            margin-top: 2px;
            font-size: 12px;
            color: var(--muted);
            direction: ltr;
            text-align: start;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url.note {
            direction: inherit;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* arrow */
        .chev {
            position: relative;
            flex: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .07);
            color: var(--muted);
            transition: background .3s, color .3s, transform .3s;
        }

        .link:hover .chev,
        .link:focus-visible .chev {
            background: var(--b);
            color: #fff;
            transform: translateX(2px);
        }

        html[dir="rtl"] .link:hover .chev { transform: translateX(-2px); }

        .chev svg { width: 16px; height: 16px; }

        html[dir="rtl"] .chev svg { transform: scaleX(-1); }

        /* compact cards: half width / grid layout */
        .link.compact {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: calc(var(--card-pad) + 4px) var(--card-pad);
        }

        .link.compact .meta { flex: none; width: 100%; }
        .link.compact .url { text-align: center; }
        .link.compact .chev { display: none; }
        .link.compact .badge { position: absolute; top: 8px; inset-inline-end: 8px; }

        /* icon layout: only the logo and a small label */
        .link.icon {
            background: none;
            border-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 6px 2px;
            gap: 8px;
            overflow: visible;
        }

        .link.icon {
            flex-direction: column;
            justify-content: flex-start;
            text-align: center;
        }

        .link.icon .meta { flex: none; width: 100%; }
        .link.icon .chev { display: none; }
        .link.icon::before { display: none; }
        .link.icon:hover, .link.icon:focus-visible { box-shadow: none; border-color: transparent; }
        .link.icon .title { font-size: 12px; font-weight: 500; color: var(--muted); }
        .link.icon .url { display: none; }
        .link.icon .badge { top: 0; inset-inline-end: 2px; }

        /* =====================================================================
           Groups: one card that expands into several links
           ===================================================================== */
        .link.group {
            display: block;
            padding: 0;
        }

        .link.group.compact { padding: 0; }

        .head {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: var(--card-pad) calc(var(--card-pad) + 2px);
            background: none;
            border: 0;
            color: inherit;
            font: inherit;
            text-align: start;
            cursor: pointer;
            position: relative;
        }

        .link.group.compact .head {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: calc(var(--card-pad) + 4px) var(--card-pad);
        }

        .link.group.compact .head .meta { flex: none; width: 100%; }
        .link.group.compact .head .chev { display: none; }
        .link.group.compact .head .url { text-align: center; }

        .link.group.icon { padding: 0; }
        .link.group.icon .head { padding: 6px 2px; }

        .badge {
            flex: none;
            min-width: 24px;
            height: 24px;
            padding: 0 8px;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--b);
            position: relative;
        }

        .head .chev svg { transform: none; transition: transform .3s; }
        .link.group.open .head .chev svg { transform: rotate(180deg); }
        html[dir="rtl"] .head .chev svg { transform: none; }
        html[dir="rtl"] .link.group.open .head .chev svg { transform: rotate(180deg); }
        .link.group .head .chev { transform: none; }

        .rows {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 0 12px 12px;
            position: relative;
        }

        .link.group.open .rows { display: flex; animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: max(10px, calc(var(--card-radius) - 8px));
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 500;
            transition: background .25s, border-color .25s;
        }

        .row:hover, .row:focus-visible { background: var(--b-soft); border-color: var(--b-mid); outline: none; }
        .row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .row .txt small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; direction: ltr; text-align: start; }
        .row .chev { width: 26px; height: 26px; background: rgba(255, 255, 255, .07); }
        .row .chev svg { width: 13px; height: 13px; }
        .row:hover .chev { background: var(--b); color: #fff; }

        /* =====================================================================
           Background image + dim (separate layers: blur never touches the content)
           ===================================================================== */
        #layerImg { background-size: cover; background-position: center; transform: scale(1.08); display: none; }
        #layerDim { display: none; }

        /* =====================================================================
           Menu
           ===================================================================== */
        .menu { width: 100%; display: none; flex-direction: column; }
        .menu.on { display: flex; }

        .mcontact { display: flex; gap: 10px; width: 100%; margin-bottom: 8px; }
        .mcontact a {
            flex: 1; text-align: center; padding: 12px; border-radius: var(--card-radius);
            border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text);
            text-decoration: none; font-weight: 600; font-size: 14px;
            backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
        }

        .mnav {
            position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
            padding: 10px 2px; margin: 0 -2px; scrollbar-width: none;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .mnav::-webkit-scrollbar { display: none; }
        .mnav a {
            flex: none; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06); color: var(--text); text-decoration: none;
            font-size: 13px; font-weight: 600; white-space: nowrap;
        }

        .msec { scroll-margin-top: 64px; display: flex; flex-direction: column; gap: var(--card-gap); margin-top: 16px; }
        .msec h2 {
            font-size: 18px; font-weight: 700; color: var(--text);
            padding-inline-start: 10px; border-inline-start: 3px solid var(--g2);
        }

        .mi {
            display: flex; gap: 12px; padding: var(--card-pad); border-radius: var(--card-radius);
            border: 1px solid var(--card-border); background: var(--card-bg);
            backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
            animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
        }
        .mi img {
            width: 84px; height: 84px; flex: none; object-fit: cover;
            border-radius: max(8px, calc(var(--card-radius) - 6px)); background: rgba(255, 255, 255, .06);
        }
        .mi .mb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .mi .mt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
        .mi .mn { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
        .mi .mp { font-weight: 700; white-space: nowrap; color: var(--g1); }
        .mi .md { font-size: 13px; color: var(--muted); line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
        .mi.off { opacity: .55; }
        .mi.off .mn, .mi.off .mp { text-decoration: line-through; }
        .mi .sold {
            align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
            background: rgba(239, 68, 68, .18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, .35);
        }

        /* =====================================================================
           Error message
           ===================================================================== */
        .error-msg {
            display: none;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding: 28px 20px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            font-size: 15px;
        }

        .error-msg .ico {
            font-size: 34px;
            display: block;
            margin-bottom: 10px;
        }

        /* =====================================================================
           Reduced motion
           ===================================================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="layer" id="layerBg" aria-hidden="true"></div>
    <div class="layer" id="layerImg" aria-hidden="true"></div>
    <div class="layer" id="layerDim" aria-hidden="true"></div>
    <div class="layer glow" id="layerGlow" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="layer" id="layerPattern" aria-hidden="true"></div>

    <main class="page">
        <div class="topbar">
            <button class="lang" id="langBtn" type="button">عربي</button>
        </div>

        <header class="profile" id="profile" style="display:none">
            <div class="avatar"><span id="avatar"></span></div>
            <h1 class="name" id="ownerName"></h1>
            <p class="sub" id="hint"></p>
            <div class="count" id="countPill"><span class="dot"></span><span id="countText"></span></div>
            <button class="save" id="saveBtn" type="button" style="display:none"></button>
        </header>

        <div class="info" id="info" style="display:none"></div>

        <nav class="links" id="linksGrid" aria-label="Links"></nav>

        <section class="menu" id="menu" aria-label="Menu"></section>

        <p class="foot" id="foot" style="display:none"></p>

        <div class="error-msg" id="errorMsg"><span class="ico">&#128279;</span><span id="errorText"></span></div>
    </main>

    <style id="customCss"></style>

    <script>
    (function () {
        "use strict";

        /* =====================================================================
           Configuration
           ===================================================================== */
        const LOGO_DIR = "logo_qr/";          // platform logos: <id>1.png

        function cleanValue(rule, value, fallback) {
            switch (rule[0]) {
                case "c":
                    return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : fallback;
                case "c0":
                    if (value === "") return "";
                    return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : fallback;
                case "n":
                    return typeof value === "number" && isFinite(value)
                        ? Math.min(rule[2], Math.max(rule[1], value)) : fallback;
                case "e":
                    return rule.indexOf(value, 1) > 0 ? value : fallback;
                case "b":
                    return value === 0 || value === 1 || value === true || value === false ? (value ? 1 : 0) : fallback;
                case "f":
                    return typeof value === "string" && Object.prototype.hasOwnProperty.call(FONTS, value) ? value : fallback;

        function hexToRgba(hex, alpha) {

        // Pages saved by an older app version could hold a wrapped link such as
        // "instagram.com/instagram.com%2Fuser". It is repaired here, so those pages work without re-saving.
        // A value that is not wrapped is returned untouched.
        function repairValue(value) {
            let v = value;
            for (let i = 0; i < 4 && v.indexOf("%") !== -1; i++) {
                let d;
                try { d = decodeURIComponent(v); } catch (e) { break; }
                if (d === v) break;
                v = d;
            }
            const twice = /^((?:https?:\/\/)?(?:www\.)?([a-z0-9-]+(?:\.[a-z0-9-]+)+)\/@?)(?=(?:https?:\/\/)?(?:www\.)?\2(?:\/|$|\?))/i;
            let found = false;
            while (twice.test(v)) { v = v.replace(twice, ""); found = true; }
            return found ? v : value;
        }

        function buildUrl(id, value) {
            if (CONTACT[id]) return CONTACT[id] + value.replace(/^(mailto:|tel:)/i, "");
            value = repairValue(value);
            return /^https?:\/\//i.test(value) ? value : "https://" + value;
        }

        function prettyUrl(id, value) {
            if (CONTACT[id]) return value.replace(/^(mailto:|tel:)/i, "");
            value = repairValue(value);
            const v = value.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
            if (id === "w") {
                const m = v.match(/wa\.me\/(\d+)/i);
                return m ? "+" + m[1] : v;
            }
            if (id === "lc") return "Google Maps";
            return v;

        function toIntentUrl(webUrl, pkg) {

                return "intent://" + u.host + u.pathname + u.search +
                    "#Intent;scheme=" + u.protocol.replace(":", "") +
                    (pkg ? ";package=" + pkg : "") +
                    ";S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
            } catch (e) {

        // scheme: fb://facewebmodal opens any facebook.com page inside the app.
        // No package is forced, so Facebook Lite works too. Not installed -> normal web page.
        function toFacebookIntent(webUrl) {
            try {
                const u = new URL(webUrl);
                if (!/(^|\.)facebook\.com$/i.test(u.hostname)) return null;
                const target = "https://www.facebook.com" + u.pathname + u.search;
                return "intent://facewebmodal/f?href=" + encodeURIComponent(target) +
                    "#Intent;scheme=fb;S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";

        /* =====================================================================

           The QR link ends with  #<base64url(deflate(payload))>

           ===================================================================== */
        function inflateHash(hash) {
            let base64 = hash.replace(/-/g, "+").replace(/_/g, "/");
            while (base64.length % 4) base64 += "=";

            const raw = window.atob(base64);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            return pako.inflateRaw(bytes, { to: "string" });

        // A text is a plain string, or {"ar": "...", "en": "..."} for a two-language page.

                const o = {

                return o.ar || o.en ? o : "";
            }
            return "";

            if (v && typeof v === "object") return v[state.lang] || v.ar || v.en || "";

        function parseLegacy(str) {

                const colon = item.indexOf(":");
                if (colon > -1) {

                    return;
                }
                const values = (Array.isArray(e.v) ? e.v : [e.v]).filter(function (v) {
                    return typeof v === "string" && v.trim() !== "";
                }).slice(0, MAX_VALUES).map(text);
                if (!values.length) return;
                entries.push({
                    i: e.i.slice(0, 4),
                    v: values,
                    t: text(e.t),
                    s: text(e.s),
                    lb: (Array.isArray(e.lb) ? e.lb : []).slice(0, MAX_VALUES).map(text),

            const sections = (Array.isArray(obj.s) ? obj.s : []).slice(0, MAX_SECTIONS).map(function (s) {
                if (!s || typeof s !== "object") return null;
                const items = (Array.isArray(s.i) ? s.i : []).slice(0, MAX_MENU_ITEMS).map(function (it) {

        /* =====================================================================
           Client edits (Firestore overlay)
           The page (items/<id>.json) is the base. A client may change a few things from admin.html;
           those changes live in Firestore (pages/<id>: perm + content) and are merged on top here,
           BEFORE the normal parsing, so every value still goes through the same cleaning as the base.
           Any problem (no config, offline, slow, no document) -> the base page is shown unchanged.
           ===================================================================== */
        const FB_TIMEOUT_MS = 2500;
        const OVERLAY_MAX_CHARS = 60000;

        function fbConfig() {
            const c = window.FB_CONFIG;
            return c && typeof c.projectId === "string" && /^[a-z0-9-]{4,40}$/.test(c.projectId) ? c : null;
        }

        function isObj(v) { return !!v && typeof v === "object" && !Array.isArray(v); }

        // Firestore REST value -> plain JavaScript value
        function fsDecode(v) {
            if (!isObj(v)) return null;
            if ("stringValue" in v) return v.stringValue;
            if ("integerValue" in v) return Number(v.integerValue);
            if ("doubleValue" in v) return Number(v.doubleValue);
            if ("booleanValue" in v) return !!v.booleanValue;
            if ("mapValue" in v) {
                const out = {};
                const f = (v.mapValue && v.mapValue.fields) || {};
                Object.keys(f).forEach(function (k) { if (k !== "__proto__") out[k] = fsDecode(f[k]); });
                return out;
            }
            if ("arrayValue" in v) return ((v.arrayValue && v.arrayValue.values) || []).map(fsDecode);
            return null;
        }

        function fetchOverlay(id) {
            const cfg = fbConfig();
            if (!cfg || typeof fetch !== "function") return Promise.resolve(null);
            const url = "https://firestore.googleapis.com/v1/projects/" + cfg.projectId +
                "/databases/(default)/documents/pages/" + id;
            const request = fetch(url)
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (doc) {
                    if (!doc || !isObj(doc.fields)) return null;
                    return { perm: fsDecode(doc.fields.perm) || {}, content: fsDecode(doc.fields.content) || {} };
                })
                .catch(function () { return null; });
            const timeout = new Promise(function (resolve) { setTimeout(function () { resolve(null); }, FB_TIMEOUT_MS); });
            return Promise.race([request, timeout]);
        }

        function applyOverlay(base, ov) {
            try {
                if (!ov || !isObj(ov.content) || !isObj(ov.perm)) return base;
                if (JSON.stringify(ov.content).length > OVERLAY_MAX_CHARS) return base;
                const c = ov.content, p = ov.perm;
                const obj = JSON.parse(JSON.stringify(base));
                const isMenu = obj.type === "menu";

                function putText(target, key, value) {
                    const v = text(value);
                    if (v === "") delete target[key]; else target[key] = v;
                }
                function put(key) { if (key in c) putText(obj, key, c[key]); }

                if (p.n) put("n");
                if (p.tx) { put("h"); put("f"); if (!isMenu) put("b"); }
                if (isMenu && p.mc) {
                    put("cur");
                    ["ph", "wa"].forEach(function (key) {
                        if (!(key in c)) return;
                        const v = typeof c[key] === "string" ? c[key].trim().slice(0, 25) : "";
                        if (v === "") delete obj[key]; else obj[key] = v;
                    });
                }

                if (!isMenu && p.lk && isObj(c.l) && Array.isArray(obj.l)) {
                    Object.keys(c.l).forEach(function (k) {
                        if (!/^\d{1,2}$/.test(k)) return;
                        const e = obj.l[Number(k)], o = c.l[k];
                        if (!isObj(e) || e.i === "_h" || !isObj(o)) return;
                        if (o.hide) { e.v = []; return; }
                        if (Array.isArray(o.v)) {
                            e.v = o.v.filter(function (s) { return typeof s === "string"; })
                                .slice(0, MAX_VALUES).map(function (s) { return s.slice(0, MAX_TEXT); });
                        }
                        if (Array.isArray(o.lb)) e.lb = o.lb.slice(0, MAX_VALUES).map(text);
                        if ("t" in o) putText(e, "t", o.t);
                        if ("s" in o) putText(e, "s", o.s);
                    });
                }

                if (isMenu && isObj(c.s) && Array.isArray(obj.s)) {
                    Object.keys(c.s).forEach(function (sk) {
                        if (!/^\d{1,2}$/.test(sk)) return;
                        const sec = obj.s[Number(sk)], so = c.s[sk];
                        if (!isObj(sec) || !isObj(so)) return;
                        if (p.mn && "t" in so) putText(sec, "t", so.t);
                        if (!isObj(so.i) || !Array.isArray(sec.i)) return;
                        Object.keys(so.i).forEach(function (ik) {
                            if (!/^\d{1,3}$/.test(ik)) return;
                            const it = sec.i[Number(ik)], io = so.i[ik];
                            if (!isObj(it) || !isObj(io)) return;
                            if (p.mp) {
                                if ("p" in io) {
                                    const pv = typeof io.p === "string" ? io.p.trim().slice(0, 40) : "";
                                    if (pv === "") delete it.p; else it.p = pv;
                                }
                                if ("off" in io) { if (io.off) it.off = 1; else delete it.off; }
                            }
                            if (p.mn) {
                                if ("t" in io && text(io.t) !== "") it.t = text(io.t);   // a dish always keeps a name
                                if ("d" in io) putText(it, "d", io.d);
                            }
                        });
                    });
                }
                return obj;
            } catch (e) {
                return base;
            }
        }

        function decodePayload(hash) {
            const str = inflateHash(hash);
            if (str.charAt(0) === "{") {
                try {
                    const obj = JSON.parse(str);
                    if (obj && obj.v === 2) return parseV2(obj);
                } catch (e) { /* not JSON: treat as an old payload */ }
            }
            return parseLegacy(str);
        }

        /* =====================================================================
           Applying a design
           ===================================================================== */
        function setVars(vars) {
            const root = document.documentElement.style;
            Object.keys(vars).forEach(function (k) { root.setProperty(k, vars[k]); });
        }

        function patternCss(bg) {
            if (bg.pt === "none") return { image: "none", size: "auto" };
            const c = hexToRgba(bg.pc, bg.po);
            switch (bg.pt) {
                case "dots":
                    return { image: "radial-gradient(" + c + " 1.6px, transparent 1.7px)", size: "22px 22px" };
                case "lines":
                    return { image: "repeating-linear-gradient(45deg, " + c + " 0 1px, transparent 1px 14px)", size: "auto" };
                case "grid":
                    return {
                        image: "linear-gradient(" + c + " 1px, transparent 1px), linear-gradient(90deg, " + c + " 1px, transparent 1px)",
                        size: "28px 28px"
                    };
                default: {
                    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='80' height='24' viewBox='0 0 80 24'>" +
                        "<path d='M0 12 Q20 0 40 12 T80 12' fill='none' stroke='" + bg.pc + "' stroke-opacity='" + bg.po +
                        "' stroke-width='1.4'/></svg>";
                    return { image: 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")', size: "80px 24px" };
                }
            }
        }

        function sanitizeCss(css) {
            if (!css) return "";
            const c = String(css).slice(0, 3000);
            if (/@import|@charset|@namespace|url\s*\(|image-set|expression|javascript:|behavior|binding|\\|<\/?style|<script/i.test(c)) return "";
            return c;
        }

        function loadFont(name) {
            if (name === "Poppins" || name === "Cairo") return;
            if (document.querySelector('link[data-font="' + name + '"]')) return;
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.setAttribute("data-font", name);
            link.href = "https://fonts.googleapis.com/css2?family=" + name.replace(/ /g, "+") +
                ":wght@400;500;600;700&display=swap";
            document.head.appendChild(link);
        }

        function cardBackground(cd) {
            switch (cd.st) {
                case "solid":   return cd.cb || "#141b34";
                case "outline": return "transparent";
                case "flat":    return cd.cb || "rgba(255, 255, 255, .06)";
                default:        return cd.cb || "linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .025))";
            }
        }

        function applyDesign(design) {
            const bg = design.bg, tx = design.tx, av = design.av, cd = design.cd;

            // page background
            document.documentElement.style.setProperty("--bg", bg.c1);
            $("layerBg").style.background = bg.m === "gradient"
                ? "linear-gradient(" + bg.a + "deg, " + [bg.c1, bg.c2, bg.c3].filter(Boolean).join(", ") + ")" : "none";
            $("layerGlow").style.display = bg.gl ? "block" : "none";
            const pattern = patternCss(bg);
            $("layerPattern").style.backgroundImage = pattern.image;
            $("layerPattern").style.backgroundSize = pattern.size;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", bg.c1);

            // background image + dim (own layers, so the blur never reaches the content)
            const imgLayer = $("layerImg"), dimLayer = $("layerDim");
            if (bg.bi) {
                imgLayer.style.backgroundImage = 'url("' + bg.bi + '")';
                imgLayer.style.filter = bg.bl ? "blur(" + bg.bl + "px)" : "none";
                imgLayer.style.display = "block";
            } else {
                imgLayer.style.display = "none";
            }
            dimLayer.style.background = "rgba(0, 0, 0, " + bg.dm + ")";
            dimLayer.style.display = bg.dm > 0 ? "block" : "none";

            // text: any Google font (ff) wins over the short list (f)
            const fontName = tx.ff || tx.f;
            if (fontName === "Poppins") {
                document.body.classList.remove("custom-font");
            } else {
                loadFont(fontName);
                document.documentElement.style.setProperty("--font", "'" + fontName + "', 'Cairo', 'Poppins', system-ui, sans-serif");
                document.body.classList.add("custom-font");
            }

            // free CSS: dropped completely when it contains anything that could load or run something
            $("customCss").textContent = sanitizeCss(design.x && design.x.css);

            const radius = { c: "50%", r: "28%", s: "10%" }[av.sh];
            const avShadow = av.gw ? "0 20px 54px -18px " + hexToRgba(tx.n2, 0.75) : "none";
            const avRing = av.rg === "g"
                ? "conic-gradient(from 210deg, var(--g1), var(--g2), var(--g3), var(--g1))"
                : (av.rg === "s" ? av.rc : "transparent");

            setVars({
                "--text": tx.c, "--muted": tx.mu,
                "--g1": tx.n1, "--g2": tx.n2, "--g3": tx.n3,
                "--gl1": bg.g1, "--gl2": bg.g2, "--gl3": bg.g3,
                "--name-size": tx.s + "px",
                "--align": { c: "center", s: "start", e: "end" }[tx.al],
                "--av-size": av.sz + "px", "--av-radius": radius, "--av-pad": av.rg === "n" ? "0px" : "3px",
                "--av-ring": avRing, "--av-inner": av.ab, "--av-shadow": avShadow,
                "--card-radius": cd.r + "px", "--card-gap": cd.gap + "px", "--card-pad": cd.pd + "px",
                "--card-bg": cardBackground(cd),
                "--card-border": cd.st === "flat" ? "transparent"
                    : (cd.bd || (cd.st === "outline" ? "rgba(255, 255, 255, .28)" : "rgba(255, 255, 255, 0.09)")),
                "--card-blur": cd.st === "glass" ? "blur(14px)" : "none",
                "--tile": cd.ts + "px", "--tile-r": Math.round(cd.ts * 0.296) + "px",
                "--tile-pad": Math.round(cd.ts * 0.185) + "px", "--tile-font": Math.round(cd.ts * 0.41) + "px",
                "--av-font": Math.round(av.sz * 0.315) + "px",
                "--cols": design.ly.m === "icons" ? 4 : 2
            });

            $("profile").className = "profile al-" + tx.al;
            $("ownerName").classList.toggle("solid", !tx.tg);
            $("linksGrid").className = "links" + (cd.sh ? "" : " noshadow");
            $("langBtn").style.visibility = design.ly.lang ? "visible" : "hidden";
            $("countPill").style.display = design.ly.cnt ? "inline-flex" : "none";
        }

        /* =====================================================================
           Page logo
           The logo is a separate file, so it never makes the QR code bigger.
           ===================================================================== */
        function mountLogo() {
            if (!state.logoImg) return;
            const avatar = $("avatar");
            avatar.textContent = "";
            avatar.appendChild(state.logoImg);
        }

        function loadLogo(id, attempt, direct) {
            const img = new Image();
            img.onload = function () {
                img.className = "photo";
                img.alt = "";
                state.logoImg = img;
                mountLogo();
            };
            img.onerror = function () {
                if (attempt < LOGO_RETRIES && state.logoFor === id) {
                    setTimeout(function () { loadLogo(id, attempt + 1, direct); }, LOGO_RETRY_MS);
                }
            };
            img.src = (direct ? id : LOGO_UPLOADS + id + ".png") + (attempt ? "?r=" + attempt : "");
        }

        /* =====================================================================
           Rendering helpers
           ===================================================================== */
        function el(tag, className, content) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (content !== undefined) node.textContent = content;
            return node;
        }

        function totalLinks() {
            return state.data.l.reduce(function (sum, e) { return sum + (e.i === "_h" ? 0 : e.v.length); }, 0);
        }

        // "Phone", "Phone 1", "Phone 2" ... : custom title wins, repeated platforms are numbered.
        function titles() {
            const t = I18N[state.lang];
            const counts = {};
            state.data.l.forEach(function (e) {
                if (e.i !== "_h" && !e.t) counts[e.i] = (counts[e.i] || 0) + 1;
            });
            const seen = {};
            return state.data.l.map(function (e) {
                if (e.i === "_h") return loc(e.t);
                if (e.t) return loc(e.t);
                const base = t.names[e.i] || e.i;
                if (state.data.legacy || counts[e.i] < 2) return base;
                seen[e.i] = (seen[e.i] || 0) + 1;
                return base + " " + seen[e.i];
            });
        }

        function showValueFor(entry, design) {
            return (entry.sv === undefined ? design.cd.sv : entry.sv) === 1;
        }

        function createTile(id, label, style) {
            const tile = el("div", "tile" + (style && style !== "white" ? " t-" + style : ""));
            const img = document.createElement("img");
            img.alt = "";
            img.src = LOGO_DIR + id + "1.png";
            img.onerror = function () {
                tile.removeChild(img);
                tile.classList.add("fb");
                tile.textContent = label.charAt(0);
            };
            tile.appendChild(img);
            return tile;
        }

        function createChevron(icon) {
            const chev = el("div", "chev");
            chev.innerHTML = icon || ICON_CHEVRON;
            return chev;
        }

        function createMeta(label, sub, isNote) {
            const meta = el("div", "meta");
            meta.appendChild(el("div", "title", label));
            if (sub) meta.appendChild(el("div", "url" + (isNote ? " note" : ""), sub));
            return meta;
        }

        // Open the app first on Android; everything else is a normal link.
        function wireLink(a, id, url) {
            a.href = url;                                       // stays as the fallback (desktop, long-press, no JS)
            a.rel = "noopener";
            if (!IS_IOS && !CONTACT[id]) a.target = "_blank";   // iOS: same tab so universal links can open the app
            a.addEventListener("click", function (ev) {
                if (!IS_ANDROID || CONTACT[id]) return;
                const intent = (id === "f" && toFacebookIntent(url)) || toIntentUrl(url, ANDROID_PKG[id]);
                if (intent) {
                    ev.preventDefault();
                    window.location.href = intent;
                }
            });
        }

        function brandFor(entry, style, design) {
            return style.ac || (design.cd.br ? (BRAND[entry.i] || DEFAULT_BRAND) : design.cd.ac);
        }

        function paintCard(node, brand, style) {
            node.style.setProperty("--b", brand);
            node.style.setProperty("--b-soft", hexToRgba(brand, 0.22));
            node.style.setProperty("--b-mid", hexToRgba(brand, 0.55));
            if (style.cb) node.style.setProperty("--own-bg", style.cb);
        }

        // How wide a card is and how it looks: list = full rows, grid = two per row, icons = logo only.
        // Per-link size: "f" full row, "h" half row.
        function cardKind(design, style) {
            const m = design.ly.m;
            if (m === "list") return style.sz === "h" ? { compact: true, span: "1" } : { span: "var(--cols)" };
            if (style.sz === "f") return { span: "var(--cols)" };
            if (m === "grid") return { compact: true, span: "1" };
            return style.sz === "h" ? { compact: true, span: "2" } : { icon: true, span: "1" };
        }

        function applyKind(node, kind, featured) {
            if (kind.icon) node.classList.add("icon");
            else if (kind.compact) node.classList.add("compact");
            if (featured) node.classList.add("featured");
            node.style.setProperty("--span", kind.span);
        }

        /* ---------- single link ---------- */
        function createCard(entry, index, label, design, ctx) {
            const style = design.e[String(index)] || {};
            const value = entry.v[0];
            const brand = brandFor(entry, style, design);
            const tileStyle = style.tl || design.cd.tl;
            const sub = loc(entry.s) || (showValueFor(entry, design) ? prettyUrl(entry.i, value) : "");

            const a = document.createElement("a");
            a.className = "link";
            a.setAttribute("aria-label", I18N[state.lang].open + " " + label);
            a.style.setProperty("--i", ctx.order++);
            paintCard(a, brand, style);
            wireLink(a, entry.i, buildUrl(entry.i, value));

            a.appendChild(createTile(entry.i, label, tileStyle));
            a.appendChild(createMeta(label, sub, !!loc(entry.s)));
            a.appendChild(createChevron());
            applyKind(a, cardKind(design, style), design.ft === index);
            return a;
        }

        /* ---------- several values of one platform ---------- */
        function rowLabel(entry, n, label, design) {
            if (loc(entry.lb[n])) return { text: loc(entry.lb[n]), small: showValueFor(entry, design) ? prettyUrl(entry.i, entry.v[n]) : "" };
            if (showValueFor(entry, design)) return { text: prettyUrl(entry.i, entry.v[n]), small: "" };
            return { text: label + " " + (n + 1), small: "" };
        }

        function createGroup(entry, index, label, design, ctx) {
            const t = I18N[state.lang];
            const style = design.e[String(index)] || {};
            const brand = brandFor(entry, style, design);
            const tileStyle = style.tl || design.cd.tl;

            const card = el("div", "link group");
            card.style.setProperty("--i", ctx.order++);
            paintCard(card, brand, style);

            const head = el("button", "head");
            head.type = "button";
            head.setAttribute("aria-expanded", "false");
            head.appendChild(createTile(entry.i, label, tileStyle));
            head.appendChild(createMeta(label, loc(entry.s), true));
            head.appendChild(el("span", "badge", String(entry.v.length)));
            head.appendChild(createChevron(ICON_DOWN));
            card.appendChild(head);

            const rows = el("div", "rows");
            entry.v.forEach(function (value, n) {
                const info = rowLabel(entry, n, label, design);
                const a = el("a", "row");
                a.setAttribute("aria-label", t.open + " " + info.text);
                wireLink(a, entry.i, buildUrl(entry.i, value));
                const txt = el("span", "txt", info.text);
                if (info.small) txt.appendChild(el("small", "", info.small));
                a.appendChild(txt);
                a.appendChild(createChevron());
                rows.appendChild(a);
            });
            card.appendChild(rows);

            head.addEventListener("click", function () {
                const open = !card.classList.contains("open");
                if (open && design.ly.ex === "one") {
                    Array.prototype.forEach.call(document.querySelectorAll(".link.group.open"), function (other) {
                        other.classList.remove("open");
                        other.firstChild.setAttribute("aria-expanded", "false");
                    });
                }
                card.classList.toggle("open", open);
                head.setAttribute("aria-expanded", open ? "true" : "false");
            });

            // a group is a full-width card, except a half-size one in the list layout
            const half = design.ly.m === "list" && style.sz === "h";
            applyKind(card, half ? { compact: true, span: "1" } : { span: "var(--cols)" }, design.ft === index);
            return card;
        }

        /* ---------- header, contact card, texts ---------- */
        function renderHeader() {
            const t = I18N[state.lang];
            const data = state.data;
            const design = state.design;
            const name = loc(data.n);
            const hasName = !!(name && name.trim() !== "");

            $("ownerName").textContent = hasName ? name : t.defaultName;

            const avatar = $("avatar");
            if (hasName) avatar.textContent = initials(name);
            else avatar.innerHTML = ICON_LINK;

            const logoKey = data.lgu || data.lg;
            if (state.logoImg && state.logoFor === logoKey) {
                mountLogo();
            } else if (data.lgu) {
                state.logoImg = null;
                state.logoFor = data.lgu;
                loadLogo(data.lgu, 0, true);
            } else if (/^[A-Za-z0-9_-]{4,40}$/.test(data.lg) && state.logoFor !== data.lg) {
                state.logoImg = null;
                state.logoFor = data.lg;
                loadLogo(data.lg, 0, false);
            }

            const hint = $("hint");
            hint.textContent = design.ly.hint ? (loc(data.h) || (data.type === "menu" ? "" : t.hint)) : "";
            hint.style.display = hint.textContent ? "block" : "none";

            const number = document.createElement("b");
            number.textContent = String(totalLinks());
            const countText = $("countText");
            countText.textContent = "";
            countText.appendChild(number);
            countText.appendChild(document.createTextNode(" " + (totalLinks() === 1 ? t.linkOne : t.linkMany)));

            const save = $("saveBtn");
            save.style.display = data.vc ? "block" : "none";
            save.textContent = t.save;

            const info = $("info");
            info.textContent = loc(data.b);
            info.style.display = loc(data.b) ? "block" : "none";

            const foot = $("foot");
            foot.textContent = loc(data.f);
            foot.style.display = loc(data.f) ? "block" : "none";

            if (data.type === "menu") $("countPill").style.display = "none";

            document.title = hasName ? name : t.defaultName;
            $("profile").style.display = "block";
        }

        function renderLinks() {
            const design = state.design;
            const grid = $("linksGrid");
            const labels = titles();
            const ctx = { order: 0 };
            grid.innerHTML = "";

            state.data.l.forEach(function (entry, index) {
                if (entry.i === "_h") {
                    if (loc(entry.t)) grid.appendChild(el("h2", "heading", loc(entry.t)));
                    return;
                }
                const grouped = entry.v.length > 1 && entry.gr !== 0;
                if (grouped) {
                    grid.appendChild(createGroup(entry, index, labels[index], design, ctx));
                } else {
                    // not grouped: one separate card per value
                    entry.v.forEach(function (value, n) {
                        const single = {
                            i: entry.i, v: [value], t: entry.t, sv: entry.sv,
                            s: n === 0 ? entry.s : ""
                        };
                        const label = entry.v.length > 1 ? (loc(entry.lb[n]) || labels[index] + " " + (n + 1)) : labels[index];
                        grid.appendChild(createCard(single, index, label, design, ctx));
                    });
                }
            });
        }

        function renderMenu() {
            const d = state.data, t = I18N[state.lang];
            const box = $("menu");
            box.innerHTML = "";
            box.classList.add("on");

            if (d.ph || d.wa) {
                const row = el("div", "mcontact");
                if (d.ph) {
                    const a = el("a", "", t.call);
                    a.href = "tel:" + d.ph.replace(/[^\d+]/g, "");
                    row.appendChild(a);
                }
                if (d.wa) {
                    const a = el("a", "", t.whatsapp);
                    a.href = "https://wa.me/" + d.wa.replace(/[^\d]/g, "");
                    a.target = "_blank";
                    a.rel = "noopener";
                    row.appendChild(a);
                }
                box.appendChild(row);
            }

            const nonEmpty = d.s.filter(function (s) { return s.i.length; });
            if (nonEmpty.length > 1) {
                const nav = el("div", "mnav");
                nonEmpty.forEach(function (s, n) {
                    const a = el("a", "", loc(s.t) || String(n + 1));
                    a.href = "#sec" + n;
                    a.addEventListener("click", function (ev) {
                        ev.preventDefault();     // the page address must stay as it is (id or data)
                        const target = document.getElementById("sec" + n);
                        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                    nav.appendChild(a);
                });
                box.appendChild(nav);
            }

            const currency = loc(d.cur);
            let order = 0;
            nonEmpty.forEach(function (s, n) {
                const sec = el("section", "msec");
                sec.id = "sec" + n;
                if (loc(s.t)) sec.appendChild(el("h2", "", loc(s.t)));
                s.i.forEach(function (it) {
                    const card = el("div", "mi" + (it.off ? " off" : ""));
                    card.style.animationDelay = Math.min(order++, 12) * 40 + "ms";
                    if (it.img) {
                        const img = document.createElement("img");
                        img.alt = "";
                        img.loading = "lazy";
                        img.src = it.img;
                        img.onerror = function () { img.remove(); };
                        card.appendChild(img);
                    }
                    const body = el("div", "mb");
                    const top = el("div", "mt");
                    top.appendChild(el("div", "mn", loc(it.t)));
                    if (it.p) top.appendChild(el("div", "mp", it.p + (currency ? " " + currency : "")));
                    body.appendChild(top);
                    if (loc(it.d)) body.appendChild(el("div", "md", loc(it.d)));
                    if (it.off) body.appendChild(el("span", "sold", t.soldOut));
                    card.appendChild(body);
                    sec.appendChild(card);
                });
                box.appendChild(sec);
            });
        }

        function renderAll() {
            applyDesign(state.design);
            renderHeader();
            if (state.data.type === "menu") {
                $("linksGrid").innerHTML = "";
                renderMenu();
            } else {
                $("menu").classList.remove("on");
                renderLinks();
            }
        }

        function showError(key) {
            $("errorText").textContent = I18N[state.lang][key || "error"];
            $("errorMsg").dataset.key = key || "error";
            $("errorMsg").style.display = "block";
            $("profile").style.display = "none";
            $("info").style.display = "none";
            $("foot").style.display = "none";
            $("linksGrid").innerHTML = "";
            $("menu").classList.remove("on");
        }

        /* =====================================================================
           Save contact (vCard): name + every phone, email and web page
           ===================================================================== */
        function vcardEscape(s) {
            return String(s).replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");
        }

        function buildVcard(data) {
            const lines = ["BEGIN:VCARD", "VERSION:3.0"];
            const own = loc(data.n);
            const name = own && own.trim() ? own.trim() : I18N[state.lang].defaultName;
            lines.push("FN:" + vcardEscape(name));
            lines.push("N:" + vcardEscape(name) + ";;;;");
            data.l.forEach(function (e) {
                if (e.i === "_h") return;
                e.v.forEach(function (v) {
                    const plain = v.replace(/^(mailto:|tel:)/i, "");
                    if (e.i === "tp") lines.push("TEL;TYPE=CELL:" + plain.replace(/[^\d+]/g, ""));
                    else if (e.i === "e") lines.push("EMAIL:" + vcardEscape(plain));
                    else if (e.i === "wb") lines.push("URL:" + buildUrl("wb", v));
                });
            });
            if (loc(data.b)) lines.push("NOTE:" + vcardEscape(loc(data.b)));
            lines.push("END:VCARD");
            return lines.join("\r\n") + "\r\n";
        }

        function saveContact() {
            if (!state.data) return;
            const blob = new Blob([buildVcard(state.data)], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "contact.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        }

        /* =====================================================================
           Language switch
           ===================================================================== */
        function setLang(lang) {
            state.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            document.documentElement.lang = lang;
            $("langBtn").textContent = I18N[lang].switchBtn;
            $("errorText").textContent = I18N[lang][$("errorMsg").dataset.key || "error"];
        }

        function toggleLang() {
            setLang(state.lang === "en" ? "ar" : "en");
            if (state.data) renderAll();
        }

        /* =====================================================================
           Start
           ===================================================================== */
        function fetchDesign(id) {
            if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) return Promise.reject(new Error("bad design id"));
            const controller = typeof AbortController === "function" ? new AbortController() : null;
            const timer = setTimeout(function () { if (controller) controller.abort(); }, DESIGN_TIMEOUT_MS);
            return fetch(DESIGN_DIR + id + ".json", { cache: "no-cache", signal: controller ? controller.signal : undefined })
                .then(function (res) {
                    clearTimeout(timer);
                    if (!res.ok) throw new Error("design " + res.status);
                    return res.json();
                });
        }

        // Pages stored on GitHub: ?id=<id>  ->  items/<id>.json (editable after the code is printed)
        function bootItem(id, token) {
            if (!ID_RE.test(id)) { state.data = null; showError(); return; }
            const base = fetch(ITEMS_DIR + id + ".json", { cache: "no-cache" })
                .then(function (res) {
                    if (!res.ok) throw new Error("item " + res.status);
                    return res.json();
                });
            Promise.all([base, fetchOverlay(id)])
                .then(function (results) {
                    if (token !== state.token) return;
                    let obj = results[0];
                    if (!obj || typeof obj !== "object" || obj.v !== 2) throw new Error("bad item");
                    if (obj.x) { state.data = null; showError("unavailable"); return; }
                    obj = applyOverlay(obj, results[1]);

                    state.data = obj.type === "menu" ? parseMenu(obj) : parseV2(obj);
                    if (!state.langSet) {
                        state.langSet = true;
                        setLang(state.data.dl || (/^ar/i.test(navigator.language || "") ? "ar" : "en"));
                    }
                    state.design = cleanDesign(state.data.dz);
                    renderAll();
                })
                .catch(function (e) {
                    if (token !== state.token) return;
                    console.error("Item error:", e);
                    state.data = null;
                    showError();
                });
        }

        function boot() {
            const hash = location.hash.slice(1);
            const token = ++state.token;
            $("errorMsg").style.display = "none";

            const id = new URLSearchParams(location.search).get("id");
            if (id) { bootItem(id, token); return; }

            if (!hash) {
                state.data = null;
                showError();
                return;
            }

            try {
                state.data = decodePayload(hash);
            } catch (e) {
                console.error("Decode error:", e);
                state.data = null;
                showError();
                return;
            }

            const data = state.data;
            if (data.dz) {
                state.design = cleanDesign(data.dz);
                renderAll();
            } else if (data.d) {
                fetchDesign(data.d).then(function (raw) {
                    if (token !== state.token) return;
                    state.design = cleanDesign(raw);
                    renderAll();
                }, function () {
                    if (token !== state.token) return;
                    state.design = cleanDesign(null);
                    renderAll();
                });
            } else {
                state.design = cleanDesign(null);
                renderAll();
            }
        }

        $("langBtn").addEventListener("click", toggleLang);
        $("saveBtn").addEventListener("click", saveContact);
        window.addEventListener("hashchange", boot);

        try {
            boot();
        } catch (e) {
            console.error("Start error:", e);
            showError();
        }
    })();
    </script>
</body>
</html>
